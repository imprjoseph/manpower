<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>imPR MCS 節點控管系統</title>
  <meta name="theme-color" content="#171717" />
  <meta name="description" content="imPR 會展專案節點與人力控管系統" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://script.google.com" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root {
      --impr-orange: #E8610A;
      --accent:      #E8610A;
      --accent-lt:   #f08040;
      --accent-pale: rgba(232,97,10,.1);
      --success:     #2ec4b6;
      --warning:     #ffb703;
      --danger:      #e63946;
      --danger-dk:   #9b1e26;
      --n100: #f7f7f7; --n200: #ebebeb; --n300: #d0d0d0;
      --n500: #888; --n700: #444; --n900: #1a1a1a;
      --sidebar-w: 250px; --topbar-h: 56px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
      --r: 8px;
      --sh: 0 1px 3px rgba(0,0,0,.1);
      --shm: 0 4px 12px rgba(0,0,0,.12);
      --shl: 0 8px 28px rgba(0,0,0,.18);
      --tr: .18s ease;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scrollbar-gutter:stable}
    body{font-family:var(--font);background:var(--n100);color:var(--n900);overflow-x:hidden;line-height:1.5;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit}
    :focus-visible{outline:3px solid rgba(232,97,10,.28);outline-offset:2px}
    #app-shell{display:flex;min-height:100vh}

    /* SIDEBAR */
    #sidebar{width:var(--sidebar-w);min-height:100vh;background:#111;display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;border-right:1px solid rgba(232,97,10,.2)}
    .sb-brand{height:72px;padding:0 18px;border-bottom:1px solid rgba(232,97,10,.18);background:#fff;display:flex;align-items:center}
    .brand-lockup{display:flex;align-items:center;width:100%}
    .sb-brand-logo{display:block;width:100%;max-width:205px;height:auto}
    .brand-mark{color:var(--accent);font-size:30px;font-weight:900;letter-spacing:-2px}
    .brand-copy{display:flex;flex-direction:column;gap:4px}
    .brand-name{font-size:12px;font-weight:700;letter-spacing:.8px}
    .brand-sub{font-size:9px;color:#777;letter-spacing:1.2px;text-transform:uppercase}
    .sb-nav{flex:1;padding:12px 0;overflow-y:auto}
    .nav-sec{padding:10px 18px 4px;font-size:9px;font-weight:700;letter-spacing:2px;color:#555;text-transform:uppercase}
    .nav-a{width:100%;display:flex;align-items:center;gap:10px;padding:10px 20px;color:rgba(255,255,255,.55);cursor:pointer;border:0;border-left:3px solid transparent;background:transparent;text-align:left;transition:color var(--tr),background var(--tr),border-color var(--tr);font:inherit;font-size:13.5px}
    .nav-a:hover{color:#fff;background:rgba(232,97,10,.08)}
    .nav-a.act{color:var(--accent);background:rgba(232,97,10,.12);border-left-color:var(--accent)}
    .nav-a i{font-size:16px;width:20px;text-align:center}
    .sb-user{padding:14px 18px;border-top:1px solid rgba(232,97,10,.2);display:flex;align-items:center;gap:10px;background:rgba(232,97,10,.05)}
    .u-ava{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
    .u-name{color:#fff;font-size:13px;font-weight:500}
    .u-role{color:var(--accent);font-size:10px;letter-spacing:.5px}
    .btn-out{background:none;border:none;color:#555;cursor:pointer;font-size:16px;transition:color var(--tr)}
    .btn-out:hover{color:var(--danger)}

    /* MAIN */
    #main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column}
    #topbar{height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--n200);padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--sh)}
    .top-title{font-size:16px;font-weight:700;color:var(--n900)}
    .top-meta{font-size:11px;color:var(--n500);margin-top:1px}
    #page{padding:24px;flex:1;width:100%;max-width:1680px;margin:0 auto}
    .top-refresh{width:auto;padding:0 10px;gap:6px}
    .top-refresh-label{font-size:12px;font-weight:650}

    /* LOGIN */
    #login{display:grid;place-items:center;min-height:100dvh;background:#f5f5f4;position:fixed;inset:0;z-index:999;padding:24px;overflow:auto}
    .lg-bg{position:absolute;inset:0;background:
      radial-gradient(circle at 15% 10%,rgba(232,97,10,.11),transparent 34%),
      linear-gradient(135deg,#fafaf9 0%,#f5f5f4 100%)}
    .lg-box{background:#fff;border:1px solid #e7e5e4;border-radius:18px;padding:34px;width:min(100%,420px);box-shadow:0 20px 60px rgba(28,25,23,.1);position:relative;z-index:1}
    .lg-brand{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:22px;border-bottom:1px solid #e7e5e4}
    .lg-logo{display:block;width:min(100%,300px);height:auto}
    .lg-brand-copy{text-align:center}
    .lg-brand-title{font-size:18px;font-weight:750;color:#1c1917;letter-spacing:.1px}
    .lg-brand-sub{font-size:12px;color:#78716c;margin-top:4px}
    .lg-lbl{display:block;font-size:12px;font-weight:650;color:#44403c;margin-bottom:7px}
    .lg-inp{width:100%;background:#fff;border:1.5px solid #d6d3d1;border-radius:10px;padding:12px 14px;font-size:15px;color:#1c1917;font-family:var(--font);outline:none;transition:border-color var(--tr),box-shadow var(--tr)}
    .lg-inp::placeholder{color:#a8a29e}
    .lg-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,97,10,.12)}
    .lg-password{position:relative}
    .lg-password .lg-inp{padding-right:48px}
    .lg-password-toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:#78716c;display:grid;place-items:center;cursor:pointer}
    .lg-password-toggle:hover{background:#f5f5f4;color:var(--accent)}
    .btn-lg{width:100%;min-height:46px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;transition:background var(--tr),box-shadow var(--tr);letter-spacing:.2px}
    .btn-lg:hover{background:#cf5205;box-shadow:0 5px 18px rgba(232,97,10,.24)}
    .btn-lg:disabled{opacity:.65;cursor:wait;box-shadow:none}
    .login-note{font-size:11px;color:#a8a29e;text-align:center;margin-top:18px}
    #lerr{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;font-size:12px;padding:9px 11px;margin-top:12px;display:none}

    /* CARDS */
    .card{background:#fff;border:1px solid var(--n200);border-radius:var(--r);box-shadow:var(--sh)}
    .card-hdr{padding:14px 20px;border-bottom:1px solid var(--n200);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:var(--r) var(--r) 0 0}

    /* STAT */
    .stat{background:#fff;border:1px solid var(--n200);border-radius:var(--r);padding:20px;display:flex;align-items:flex-start;gap:16px;box-shadow:var(--sh);transition:transform var(--tr),box-shadow var(--tr)}
    .stat:hover{transform:translateY(-2px);box-shadow:var(--shm)}
    .stat-ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
    .ic-or{background:rgba(232,97,10,.1);color:var(--accent)}
    .ic-gr{background:rgba(46,196,182,.1);color:var(--success)}
    .ic-ye{background:rgba(255,183,3,.1);color:var(--warning)}
    .ic-re{background:rgba(230,57,70,.1);color:var(--danger)}
    .stat-v{font-size:30px;font-weight:800;line-height:1;color:var(--n900);font-family:var(--mono)}
    .stat-l{font-size:12px;color:var(--n500);margin-top:4px}

    /* PROJECT CARD */
    .pcard{background:#fff;border:1px solid var(--n200);border-radius:var(--r);padding:16px 20px;cursor:pointer;transition:all var(--tr);position:relative;overflow:hidden;margin:12px}
    .pcard:hover{border-color:var(--accent);box-shadow:var(--shm);transform:translateY(-1px)}
    .pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--success)}
    .pcard.s-warn::before{background:var(--warning)}
    .pcard.s-dang::before{background:var(--danger)}
    .pcard.s-blok::before{background:var(--danger-dk)}
    .pname{font-size:15px;font-weight:700;color:var(--n900)}
    .pmeta{font-size:12px;color:var(--n500);display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
    .prog{height:5px;background:var(--n200);border-radius:99px;overflow:hidden;margin:10px 0}
    .prog-f{height:100%;border-radius:99px;background:var(--accent);transition:width .5s ease}

    /* PROJECT LIST */
    .project-page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}
    .project-page-head .sec-title{margin-bottom:3px}
    .project-page-sub{font-size:12px;color:var(--n500)}
    .project-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
    .project-summary-item{background:#fff;border:1px solid var(--n200);border-radius:10px;padding:13px 15px;box-shadow:var(--sh)}
    .project-summary-label{font-size:10px;font-weight:700;letter-spacing:.7px;color:var(--n500)}
    .project-summary-value{margin-top:3px;font:800 24px/1.2 var(--mono);color:var(--n900)}
    .project-summary-item.is-active{border-top:3px solid var(--accent)}
    .project-summary-item.is-done{border-top:3px solid var(--success)}
    .project-summary-item.is-other{border-top:3px solid var(--n300)}
    .project-tool-panel{background:#fff;border:1px solid var(--n200);border-radius:10px;padding:12px 14px;margin-bottom:18px;box-shadow:var(--sh)}
    .project-tool-panel .tool-bar{margin:0}
    .project-result-note{font-size:11px;color:var(--n500);white-space:nowrap;margin-left:auto}
    .project-groups{display:grid;gap:18px}
    .project-group{background:#fff;border:1px solid var(--n200);border-radius:10px;overflow:hidden;box-shadow:var(--sh)}
    .project-group,.card,.table-responsive{content-visibility:auto;contain-intrinsic-size:auto 420px}
    .project-group-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--n100);border-bottom:1px solid var(--n200)}
    .project-group-title{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:750;color:var(--n900)}
    .project-group-title::before{content:"";width:4px;height:18px;border-radius:99px;background:var(--accent)}
    .project-group-count{font:700 11px var(--mono);color:var(--n500);background:#fff;border:1px solid var(--n200);border-radius:99px;padding:3px 9px}
    .project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
    .project-list-card{position:relative;padding:17px 18px 16px;border-bottom:1px solid var(--n200);transition:background var(--tr);cursor:pointer;min-width:0}
    .project-list-card:nth-child(odd){border-right:1px solid var(--n200)}
    .project-list-card:hover{background:rgba(232,97,10,.035)}
    .project-list-main{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .project-list-name{font-size:14px;font-weight:750;line-height:1.4;color:var(--n900);overflow-wrap:anywhere}
    .project-list-client{font-size:11px;color:var(--n500);margin-top:3px}
    .project-list-meta{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(90px,1fr);gap:8px 14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--n200)}
    .project-meta-label{display:block;font-size:9px;font-weight:700;letter-spacing:.6px;color:var(--n500);margin-bottom:2px}
    .project-meta-value{display:block;font-size:11px;color:var(--n700);overflow-wrap:anywhere}
    .project-list-actions{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:13px}
    .project-open-link{margin-right:auto;padding:3px 0;border:0;background:transparent;font-size:11px;font-weight:700;color:var(--accent);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
    .project-open-link:hover{text-decoration:underline}
    .project-empty{padding:44px 20px;text-align:center;color:var(--n500);background:#fff;border:1px dashed var(--n300);border-radius:10px}

    /* BADGES */
    .bdg{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;display:inline-block}
    .b-norm{background:rgba(46,196,182,.12);color:#0d8a82}
    .b-warn{background:rgba(255,183,3,.15);color:#b37d00}
    .b-dang{background:rgba(230,57,70,.12);color:var(--danger)}
    .b-blok{background:rgba(155,30,38,.12);color:var(--danger-dk)}
    .b-done{background:rgba(46,196,182,.1);color:#0d8a82}
    .b-prog{background:rgba(232,97,10,.1);color:var(--accent)}
    .b-pend{background:rgba(136,136,136,.1);color:var(--n500)}
    .dl-0{background:#e8f5e9;color:#2e7d32}
    .dl-1{background:#fff8e1;color:#f57f17}
    .dl-2{background:#fff3e0;color:#e65100}
    .dl-3{background:#fce4ec;color:#b71c1c}
    .dl-4{background:#3d0000;color:#ff8a80}
    .r-unc{background:#f3f4f6;color:#6b7280}
    .r-pnd{background:#fef3c7;color:#92400e}
    .r-cfm{background:#d1fae5;color:#065f46}
    .r-exp{background:#fee2e2;color:#991b1b}

    /* MS ROW */
    .ms-table{width:100%}.ms-tr{transition:background .12s}.ms-tr:hover{background:var(--n100)!important}.ms-tr-alert{background:rgba(230,57,70,.05)!important}.ms-tr-alert:hover{background:rgba(230,57,70,.08)!important}
    .ms-overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--n200)}
    .ms-overview-item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--n100);border:1px solid var(--n200);border-radius:8px;padding:9px 11px}
    .ms-overview-label{font-size:10px;color:var(--n500);font-weight:700}
    .ms-overview-value{font:800 17px/1 var(--mono);color:var(--n900)}
    .ms-overview-item.is-active .ms-overview-value{color:var(--accent)}
    .ms-overview-item.is-alert .ms-overview-value{color:var(--danger)}
    .ms-overview-item.is-done .ms-overview-value{color:#0d8a82}
    .ms-filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 16px;background:#fff;border-bottom:1px solid var(--n200)}
    .ms-search{flex:1;min-width:220px;border:1.5px solid var(--n200);border-radius:8px;padding:8px 11px;font-size:12px;outline:none}
    .ms-search:focus,.ms-filter-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-pale)}
    .ms-filter-select{border:1.5px solid var(--n200);border-radius:8px;padding:8px 28px 8px 10px;background:#fff;font-size:11px;outline:none}
    .ms-completed-toggle{border:1px solid var(--n300);border-radius:8px;background:#fff;color:var(--n700);padding:7px 10px;font-size:11px;font-weight:650;cursor:pointer;white-space:nowrap}
    .ms-completed-toggle.active{border-color:var(--accent);background:var(--accent-pale);color:var(--accent)}
    .ms-filter-result{font-size:10px;color:var(--n500);white-space:nowrap}
    .ms-tr.ms-filter-hidden{display:none}
    .ms-category{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:5px;font-size:10px;font-weight:700;white-space:nowrap}
    .ms-cat-0{background:#fff1e8;color:#b94700}.ms-cat-1{background:#eef2ff;color:#4338ca}.ms-cat-2{background:#f3e8ff;color:#7e22ce}
    .ms-cat-3{background:#ecfeff;color:#0e7490}.ms-cat-4{background:#fef3c7;color:#92400e}.ms-cat-5{background:#f0fdf4;color:#15803d}
    .ms-cat-6{background:#eff6ff;color:#1d4ed8}.ms-cat-7{background:#fdf2f8;color:#be185d}.ms-cat-8{background:#f3f4f6;color:#4b5563}
    .ms-cat-9{background:#f5f5f4;color:#57534e}.ms-cat-10{background:#ecfdf5;color:#047857}
    .ms-cat-11{background:#fff7ed;color:#c2410c}.ms-cat-12{background:#fef2f2;color:#b91c1c}.ms-cat-13{background:#f0fdfa;color:#0f766e}
    .ms-category-row td{padding:0!important;background:#f8f8f7;border-top:1px solid var(--n200);border-bottom:1px solid var(--n200)}
    .ms-category-toggle{width:100%;display:flex;align-items:center;gap:9px;padding:9px 14px;border:0;background:transparent;color:var(--n900);font-size:11px;font-weight:750;text-align:left;cursor:pointer}
    .ms-category-toggle:hover{background:rgba(232,97,10,.045)}
    .ms-category-toggle .ms-category-chevron{color:var(--n500);transition:transform var(--tr)}
    .ms-category-toggle[aria-expanded="false"] .ms-category-chevron{transform:rotate(-90deg)}
    .ms-category-total{margin-left:auto;font:700 10px var(--mono);color:var(--n500);background:#fff;border:1px solid var(--n200);border-radius:99px;padding:2px 8px}
    .ms-category-row.ms-group-hidden{display:none}
    .sort-mode .ms-category-row{display:none!important}
    
    

    /* BTN */
    .btn-ac{background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all var(--tr);display:inline-flex;align-items:center;gap:6px}
    .btn-ac:hover{background:var(--accent-lt);transform:translateY(-1px);box-shadow:0 4px 12px rgba(232,97,10,.3)}
    .btn-ac:disabled,.btn-ic:disabled{opacity:.58;cursor:not-allowed;transform:none;box-shadow:none}
    .btn-ic{width:30px;height:30px;border:1px solid var(--n200);border-radius:6px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--n700);transition:all var(--tr)}
    .btn-ic:hover{background:var(--n100)}
    .btn-ic.dl:hover{background:rgba(230,57,70,.08);border-color:var(--danger);color:var(--danger)}

    /* MODAL */
    .modal-content{border-radius:var(--r);border:none;box-shadow:var(--shl)}
    .modal-header{background:var(--n900);color:#fff;border-radius:var(--r) var(--r) 0 0;padding:14px 20px;border-bottom:2px solid var(--accent)}
    .modal-title{font-size:14px;font-weight:700}
    .modal-header .btn-close{filter:invert(1)}
    .form-label{font-size:12px;font-weight:600;color:var(--n700);margin-bottom:4px}
    .form-control{border:1.5px solid var(--n200);border-radius:var(--r);padding:9px 12px;font-size:13px}
    .form-control:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,97,10,.12);outline:none}
    .modal-footer [role="status"]{max-width:440px;line-height:1.4}

    /* LOADING/TOAST */
    .ld-ov{position:fixed;inset:0;background:rgba(247,247,247,.76);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:9999}
    .ld-box{min-width:150px;background:#fff;border:1px solid var(--n200);border-radius:12px;box-shadow:var(--shm);padding:18px 22px;display:flex;align-items:center;gap:12px;color:var(--n700);font-size:13px;font-weight:650}
    .ld-ring{width:44px;height:44px;border:3px solid rgba(232,97,10,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .t-msg{position:fixed;top:68px;right:20px;z-index:9999;min-width:280px;border-radius:var(--r);box-shadow:var(--shm);animation:sli .25s ease}
    @keyframes sli{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}

    /* UTILS */
    .font-mono{font-family:var(--mono)}
    .fw6{font-weight:600}
    .sec-title{font-size:18px;font-weight:700;color:var(--n900);margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .empty{text-align:center;padding:48px 24px;color:var(--n500)}
    .empty i{font-size:48px;margin-bottom:12px;display:block}
    .impact-box{background:#fff;border:2px solid var(--danger);border-radius:var(--r);padding:24px}
    .mobile-menu{display:none}
    .sidebar-scrim{display:none}
    @media(max-width:768px){
      :root{--topbar-h:60px}
      #sidebar{transform:translateX(-100%);transition:transform .22s ease;box-shadow:12px 0 30px rgba(0,0,0,.2)}
      body.nav-open #sidebar{transform:translateX(0)}
      body.nav-open .sidebar-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:90}
      #main{margin-left:0;min-width:0}

    /* 多日期選擇器 */

    /* 加密帳密櫃 */

    .vault-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-pale)}

    .vault-card{background:#fff;border:1px solid var(--n200);border-radius:10px;padding:16px;box-shadow:var(--sh);transition:border-color var(--tr),box-shadow var(--tr)}
    .vault-card:hover{border-color:rgba(232,97,10,.45);box-shadow:var(--shm)}
    .vault-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
    .vault-site{font-size:14px;font-weight:750;overflow-wrap:anywhere}
    .vault-url{font-size:10px;color:var(--accent);margin-top:4px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .vault-field{background:var(--n100);border-radius:7px;padding:8px 10px;margin-top:7px}
    .vault-field-label{font-size:9px;letter-spacing:.8px;color:var(--n500);font-weight:700}
    .vault-field-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
    .vault-value{font-size:12px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .vault-action{border:0;background:transparent;color:var(--n500);cursor:pointer;padding:3px}
    .vault-action:hover{color:var(--accent)}
    .vault-category{display:inline-flex;font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-pale);border-radius:99px;padding:2px 8px;margin-top:10px}

    /* ProFlow 營運工具 */

    .tool-sub{font-size:12px;color:var(--n500);margin-top:4px}
    .tool-local-note{background:#fff8ed;border:1px solid #fed7aa;color:#9a4b06;border-radius:8px;padding:8px 11px;font-size:11px;margin-bottom:14px;display:flex;gap:7px}
    .tool-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:15px}
    .tool-search{flex:1;min-width:220px;border:1.5px solid var(--n200);border-radius:8px;padding:9px 12px;font-size:13px;background:#fff;outline:none}
    .tool-search:focus,.tool-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-pale)}
    .tool-select{border:1.5px solid var(--n200);border-radius:8px;padding:9px 30px 9px 11px;font-size:12px;background:#fff;outline:none}
    .tool-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .tool-card{background:#fff;border:1px solid var(--n200);border-radius:10px;padding:16px;box-shadow:var(--sh);min-width:0}
    .tool-card-title{font-size:14px;font-weight:750;overflow-wrap:anywhere}
    .tool-card-meta{font-size:11px;color:var(--n500);margin-top:4px}
    .tool-card-actions{display:flex;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--n200)}
    .tool-pill{display:inline-flex;align-items:center;font-size:10px;font-weight:700;background:var(--accent-pale);color:var(--accent);padding:3px 8px;border-radius:99px}
    .cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .cal-title{font-size:17px;font-weight:750}
    .calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--n200);border:1px solid var(--n200);border-radius:10px;overflow:hidden}
    .cal-weekday{background:var(--n900);color:#fff;text-align:center;padding:8px 4px;font-size:11px;font-weight:700}
    .cal-day{background:#fff;min-height:112px;padding:7px;min-width:0}
    .cal-day.is-other{background:#fafafa;color:#aaa}
    .cal-day.is-today{box-shadow:inset 0 0 0 2px var(--accent)}
    .cal-num{font-size:11px;font-family:var(--mono);margin-bottom:5px}
    .cal-event{display:block;width:100%;border:0;border-left:3px solid var(--accent);background:var(--accent-pale);color:var(--n900);border-radius:4px;padding:4px 5px;margin-top:4px;font-size:10px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
    .process-steps{list-style:none;margin:12px 0 0;padding:0;counter-reset:steps}
    .process-step{counter-increment:steps;display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--n200);font-size:12px}
    .process-step::before{content:counter(steps);width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
    .money-positive{color:#087f5b}.money-negative{color:var(--danger)}
    .budget-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
    .budget-stat{background:#fff;border:1px solid var(--n200);border-radius:9px;padding:15px}
    .budget-stat-label{font-size:11px;color:var(--n500)}
    .budget-stat-value{font-size:21px;font-weight:800;font-family:var(--mono);margin-top:4px}
    @media(max-width:1100px){.tool-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.budget-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:700px){
      .tool-hero{flex-direction:column}.tool-grid{grid-template-columns:1fr}.budget-summary{grid-template-columns:1fr 1fr}
      .calendar-grid{min-width:780px}.calendar-scroll{overflow-x:auto;border-radius:10px}
    }
  </style>
</head>

      <input type="hidden" id="fp-id" />

      <div class="col-md-6"><label class="form-label">活動類型 *</label>
        <select id="fp-t" class="form-control"><option value="">載入中...</option></select></div>
      <div class="col-md-3"><label class="form-label">活動天數 / 梯次</label>
        <input id="fp-dy" type="number" class="form-control" value="1" min="1" max="20" oninput="renderDatePickers()" /></div>
      <div class="col-md-3 d-flex align-items-end">

          <input class="form-check-input" type="checkbox" id="fp-multi" onchange="renderDatePickers()">

      </div>

      <div class="col-md-6"><label class="form-label">PM 負責人</label><input id="fp-pm" type="text" class="form-control" /></div>

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ============================================================
// ★ 必改：貼上您的 GAS 部署 URL
// ============================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzhUkj4qok6CtSTN82wT_uMURtY6ZgmRXbpq924m1Z_BDao8jqnLzBWEZHKWgnRT9y8/exec';

// 品牌標誌改用 HTML / CSS 呈現，避免把大型圖片塞進首屏。

// ============================================================
// 全域狀態
// ============================================================
const APP = {token:null,user:null,page:'dashboard',proj:null};
let PROJECT_SUBMIT_IN_FLIGHT=false;
let PROJECT_SUBMIT_UNCERTAIN=false;

// ============================================================
// 初始化
// ============================================================
document.addEventListener('DOMContentLoaded',()=>{
  const updateClock=()=>{
    const el=document.getElementById('t-clk');
    if(el) el.textContent=new Date().toLocaleString('zh-TW',{hour12:false,hour:'2-digit',minute:'2-digit'});
  };
  updateClock();
  setInterval(updateClock,60000);
  const t=localStorage.getItem('mcs_t'), u=localStorage.getItem('mcs_u');
  if(t&&u){
    try{ APP.token=t; APP.user=JSON.parse(u); showApp(); nav('dashboard'); }
    catch{ localStorage.removeItem('mcs_t'); localStorage.removeItem('mcs_u'); }
  }
});

// ============================================================
// 認證
// ============================================================
async function doLogin(event){
  if(event) event.preventDefault();
  const u=document.getElementById('iu').value.trim();
  const p=document.getElementById('ip').value.trim();
  if(!u||!p){lerr('請輸入帳號與密碼');return;}
  const btn=document.getElementById('login-btn');
  const label=btn.querySelector('.login-btn-label');
  document.getElementById('lerr').style.display='none';
  btn.disabled=true;
  btn.setAttribute('aria-busy','true');
  label.textContent='登入中…';
  try{
    const r=await doPost({action:'login',username:u,password:p});
    if(r.success){
      APP.token=r.token; APP.user=r.user;
      localStorage.setItem('mcs_t',r.token);
      localStorage.setItem('mcs_u',JSON.stringify(r.user));
      showApp(); nav('dashboard');
    } else lerr(r.error||'登入失敗');
  }catch(e){
    lerr('連線失敗，請確認 GAS_URL 設定是否正確。\n錯誤：'+e.message);
  }finally{
    btn.disabled=false;
    btn.removeAttribute('aria-busy');
    label.textContent='登入系統';
  }
}
function lerr(m){const el=document.getElementById('lerr');el.textContent=m;el.style.display='block';}
function togglePassword(btn){
  const input=document.getElementById('ip');
  const show=input.type==='password';
  input.type=show?'text':'password';
  btn.setAttribute('aria-label',show?'隱藏密碼':'顯示密碼');
  btn.setAttribute('aria-pressed',String(show));
  btn.querySelector('i').className=`bi ${show?'bi-eye-slash':'bi-eye'}`;
  input.focus();
}

function refresh(){
  FORCE_API_REFRESH_UNTIL=Date.now()+3000;

  nav(APP.page,APP.proj);

function nav(page,param){
  closeNav();
  APP.page=page;
  document.querySelectorAll('.nav-a').forEach(e=>e.classList.remove('act'));
  const navItem=document.querySelector(`.nav-a[data-page="${page}"]`);
  if(navItem) navItem.classList.add('act');
  switch(page){
    case 'dashboard':   loadDash();break;
    case 'projects':    loadProjs();break;
    case 'calendar':    loadProjectCalendar();break;
    case 'proj-detail': loadDetail(param);break;
    case 'closed':      loadClosed();break;
    case 'resources':   loadRes();break;
    case 'cases':       loadDocumentCenter('case');break;
    case 'forms':       loadDocumentCenter('form');break;
    case 'chores':      loadChores();break;
    case 'budget':      loadBudget();break;
    case 'vendors':     loadVendors();break;
    case 'delay-sim':   loadDelay(param);break;
    case 'admin':       loadAdmin();break;
    case 'credentials': loadCredentials();break;
    case 'profile':     loadProfile();break;
    case 'proj-stats':  loadProjStats(param);break;
    case 'logs':        loadLogs();break;
    case 'workforce':   loadWorkforce();break;
    case 'gantt':       loadGantt(param);break;
    case 'kpi-dash':    loadKpiDash(param);break;
    case 'proj-risk':   loadRiskReport(param);break;
  }
}

function projectSummaryHtml(projects){
  const active=projects.filter(p=>p.projectStatus==='進行中').length;
  const pending=projects.filter(p=>['未開始','規劃中'].includes(p.projectStatus)).length;
  const done=projects.filter(p=>p.projectStatus==='結案'||p.projectStatus==='已完成').length;
  return `<div class="project-summary">
    <div class="project-summary-item"><div class="project-summary-label">全部專案</div><div class="project-summary-value">${projects.length}</div></div>

function projectStatusClass(status){
  if(status==='結案'||status==='已完成')return'b-done';
  if(status==='延遲'||status==='卡關'||status==='暫停')return'b-dang';
  if(status==='未開始'||status==='規劃中')return'b-pend';

function projectRowsHtml(projects){
  if(!projects.length)return'<div class="project-empty"><i class="bi bi-search d-block mb-2" style="font-size:28px"></i><div class="fw6">找不到符合條件的專案</div><div style="font-size:11px;margin-top:4px">請調整關鍵字或狀態篩選條件</div></div>';
  const order=['進行中','規劃中','未開始','延遲','卡關','暫停','已完成','結案'];
  const groups=new Map();
  projects.forEach(p=>{const status=p.projectStatus||'未分類';if(!groups.has(status))groups.set(status,[]);groups.get(status).push(p);});
  return `<div class="project-groups">${[...groups.entries()].sort((a,b)=>{
    const ai=order.indexOf(a[0]),bi=order.indexOf(b[0]);return(ai<0?99:ai)-(bi<0?99:bi)||a[0].localeCompare(b[0]);
  }).map(([status,items])=>`<section class="project-group"><header class="project-group-head"><div class="project-group-title">${esc(status)}</div><span class="project-group-count">${items.length} 個專案</span></header><div class="project-grid">${items.map(projectCardHtml).join('')}</div></section>`).join('')}</div>`;
}

  document.getElementById('project-list-body').innerHTML=projectRowsHtml(projects);
  document.getElementById('project-result-note').textContent=`顯示 ${projects.length}／${PROJECT_LIST_CACHE.length} 個專案`;
}

    ['媒體露出',['媒體','新聞','記者','採訪','公關','露出','press']],
    ['後勤作業',['後勤作業','採購財務','安全申請','採購','詢價','比價','報價','下單','合約','訂金','請款','付款','發票','結算','預算控管','保險','消防','醫護','保全','政府申請','場地申請','緊急應變','安全計畫','交通','接駁','住宿','機票','行政','倉儲','物流','清潔']],
    ['現場佈置',['場地','場佈','佈置','背板','舞台','動線','指示牌','場勘']],
    ['燈光音響',['燈光','音響','控台','音控','燈控','麥克風','喇叭','pa系統','av設備']],
    ['直播作業',['直播','串流','導播','轉播','訊號測試','streaming']],
    ['講師溝通',['講師','講者','speaker','講稿','簡報']],
    ['賓客接待',['賓客','來賓','貴賓','邀請函','報名','報到','座位','座次','識別證','名牌','來賓名單','vip']],
    ['週邊製作',['週邊','周邊','贈品','紀念品','印刷','輸出','製作物','設計製作']],
    ['餐點安排',['餐點','餐飲','茶點','便當','飲料','catering']],
    ['影音製作',['影音','影片','攝影','錄影','剪輯','後製','拍攝','動畫']],

    ['攤位聯絡',['攤位','攤商','參展','展商']]
  ];

let HIDE_COMPLETED_MILESTONES=true;
const COLLAPSED_MILESTONE_CATEGORIES=new Set();
function toggleMilestoneCategory(category,button){
  if(COLLAPSED_MILESTONE_CATEGORIES.has(category))COLLAPSED_MILESTONE_CATEGORIES.delete(category);
  else COLLAPSED_MILESTONE_CATEGORIES.add(category);
  if(button)button.setAttribute('aria-expanded',String(!COLLAPSED_MILESTONE_CATEGORIES.has(category)));
  filterMilestoneList();
}
function toggleCompletedMilestones(){
  HIDE_COMPLETED_MILESTONES=!HIDE_COMPLETED_MILESTONES;
  const btn=document.getElementById('ms-completed-toggle');
  if(btn){
    btn.classList.toggle('active',HIDE_COMPLETED_MILESTONES);
    btn.setAttribute('aria-pressed',String(HIDE_COMPLETED_MILESTONES));
    btn.innerHTML=HIDE_COMPLETED_MILESTONES?'<i class="bi bi-eye-slash me-1"></i>已隱藏完成':'<i class="bi bi-eye me-1"></i>顯示已完成';
  }
  filterMilestoneList();
}
function filterMilestoneList(){
  const list=document.querySelector('tbody.ms-list-wrap');if(!list)return;
  const search=(document.getElementById('ms-search')?.value||'').trim().toLowerCase();
  const status=document.getElementById('ms-status-filter')?.value||'';
  const category=document.getElementById('ms-category-filter')?.value||'';
  const rows=[...list.querySelectorAll('tr[data-mid]')];
  const filtering=Boolean(search||status||category);
  let visible=0;
  rows.forEach(row=>{
    const match=(!search||(row.dataset.search||'').includes(search))&&(!status||row.dataset.status===status)&&(!category||row.dataset.category===category)&&(_sortMode||!HIDE_COMPLETED_MILESTONES||row.dataset.status!=='已完成');
    const collapsed=!_sortMode&&!filtering&&COLLAPSED_MILESTONE_CATEGORIES.has(row.dataset.category);
    row.classList.toggle('ms-filter-hidden',!match||collapsed);if(match&&!collapsed)visible++;
  });
  list.querySelectorAll('tr[data-category-header]').forEach(header=>{
    const group=header.dataset.categoryHeader;
    const matched=rows.filter(row=>row.dataset.category===group&&!row.classList.contains('ms-filter-hidden')).length;
    header.classList.toggle('ms-group-hidden',filtering&&matched===0);
    const button=header.querySelector('.ms-category-toggle');if(button)button.setAttribute('aria-expanded',String(filtering||_sortMode||!COLLAPSED_MILESTONE_CATEGORIES.has(group)));
  });
  const result=document.getElementById('ms-filter-result');if(result)result.textContent=`顯示 ${visible}／${rows.length} 個節點`;
}

async function loadDelay(mid){
  setTop('延遲影響模擬','關鍵節點延遲連鎖分析');
  if(!mid){pg(`<div class="empty"><i class="bi bi-exclamation-triangle" style="color:var(--warning)"></i><p>請從專案詳細頁選取延遲節點</p><button class="btn-ac mt-3" onclick="nav('projects')">前往專案</button></div>`);return;}
  ld(true);
  try{
    const r=await doGet({action:'calculateDelayImpact',token:APP.token,milestoneId:mid});
    if(!r.success){apiErr(r);return;}
    const lc=['#e8f5e9','#fff8e1','#fff3e0','#fce4ec','#2d0000'];
    const lt=['正常','輕微（可內部吸收）','中度（需壓縮後續）','嚴重（需啟動調整方案）','危急（需重新排程）'];
    pg(`<div class="impact-box" style="border-color:${r.delayLevel>=3?'var(--danger-dk)':'var(--warning)'}">
      <div class="d-flex align-items-center gap-3 mb-3">
        <i class="bi bi-exclamation-octagon-fill" style="font-size:28px;color:var(--danger)"></i>
        <div><div style="font-size:17px;font-weight:700">${r.milestoneName}</div>
          <div style="font-size:12px;color:var(--n500)">計畫日期：${fd(r.plannedDate)}</div></div>
        ${r.isCritical==='TRUE'?'<span class="bdg b-dang ms-auto">🔴 關鍵節點</span>':''}
      </div>
      <div class="row g-3 mb-4">
        <div class="col-md-3"><div style="font-size:11px;color:var(--n500)">延遲天數</div>
          <div style="font-size:40px;font-weight:900;font-family:var(--mono);color:var(--danger)">+${r.delayDays}</div></div>
        <div class="col-md-4"><div style="font-size:11px;color:var(--n500)">延遲等級</div>
          <div style="background:${lc[r.delayLevel]};color:var(--danger);padding:4px 14px;border-radius:99px;font-weight:700;font-size:13px;display:inline-block;margin-top:4px">Level ${r.delayLevel}：${lt[r.delayLevel]}</div></div>
        <div class="col-md-5"><div style="font-size:11px;color:var(--n500)">受影響節點</div>
          <div style="font-size:26px;font-weight:700;color:var(--warning)">${r.affectedCount} 個</div>
          ${r.criticalAffectedCount>0?`<div style="font-size:11px;color:var(--danger)">⚠ 含 ${r.criticalAffectedCount} 個關鍵節點</div>`:''}</div>
      </div>
      ${r.affectedMilestones.length>0?`<div class="mb-4">
        <div style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--n700)">受影響節點列表</div>
        <table class="table table-sm table-bordered" style="font-size:12px">
          <thead style="background:var(--n100)"><tr><th>節點名稱</th><th>原計畫日</th><th>預估新日期</th><th>關鍵</th><th>狀態</th></tr></thead>
          <tbody>${r.affectedMilestones.map(m=>`<tr class="${m.isCritical==='TRUE'?'table-danger':''}">
            <td>${m.milestoneName}</td>
            <td class="font-mono">${fd(m.plannedDate)}</td>
            <td class="font-mono" style="color:var(--danger)">${m.estimatedNewDate}</td>
            <td>${m.isCritical==='TRUE'?'🔴':'-'}</td>
            <td>${m.status}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>`:''}
      <div><div style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--n700)">建議處理行動</div>
        ${r.recommendations.map(rec=>`<div style="padding:9px 12px;background:var(--n100);border-radius:6px;font-size:13px;margin-bottom:6px;border-left:3px solid var(--accent)">${rec}</div>`).join('')}
      </div>
    </div>`);
  }finally{ld(false);}
}

function loadAdmin(){
  if(!APP.user||APP.user.role!=='Admin'){toast('danger','僅 Admin 可進入系統管理');return;}
  setTop('系統管理','模版節點管理 / 帳號管理');
  pg(`
    <div class="sec-title"><i class="bi bi-gear"></i>系統管理</div>
    <!-- Tab 切換 -->
    <ul class="nav nav-tabs mb-3" id="admin-tabs">
      <li class="nav-item">
        <a class="nav-link active" id="tab-tmpl-btn" onclick="switchAdminTab('tmpl')" style="cursor:pointer">
          <i class="bi bi-diagram-3 me-1"></i>模版節點管理
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="tab-type-btn" onclick="switchAdminTab('type')" style="cursor:pointer">
          <i class="bi bi-tags me-1"></i>專案類型管理
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="tab-user-btn" onclick="switchAdminTab('user')" style="cursor:pointer">
          <i class="bi bi-people me-1"></i>帳號管理
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="tab-log-btn" onclick="switchAdminTab('log')" style="cursor:pointer">
          <i class="bi bi-journal-text me-1"></i>系統日誌
        </a>
      </li>
    </ul>
    <div id="admin-tab-content">
      <div id="tab-tmpl"><div class="text-center py-4"><div class="ld-ring mx-auto"></div></div></div>
      <div id="tab-type" style="display:none"></div>
      <div id="tab-user" style="display:none"></div>
      <div id="tab-log"  style="display:none"></div>
    </div>
  `);
  // 預設載入模版 tab
  loadTmplTab();
}

function switchAdminTab(tab){
  ['tmpl','type','user','log'].forEach(t=>{
    document.getElementById('tab-'+t+'-btn').classList.toggle('active', tab===t);
    document.getElementById('tab-'+t).style.display = tab===t?'':'none';
  });
  if(tab==='tmpl' && !document.getElementById('tab-tmpl').dataset.loaded) loadTmplTab();
  if(tab==='type'  && !document.getElementById('tab-type').dataset.loaded)  loadEventTypeTab();
  if(tab==='user'  && !document.getElementById('tab-user').dataset.loaded)  loadUserTab();
  if(tab==='log'   && !document.getElementById('tab-log').dataset.loaded)   loadLogTab();
}

function detailedAttachmentTasksFor(eventType){
  const key=ATTACHMENT_TYPE_KEY[eventType];
  return ATTACHMENT_DETAILED_TASKS.filter(item=>item[0]==='*'||item[0].includes(key)).map(item=>({
    milestoneName:item[1],category:item[2],weeksBefore:item[3],defaultRole:item[4],
    isCritical:item[5],description:item[6],affectedMilestones:''
  }));
}
function shortAttachmentAffectedNames(value){
  const aliases={'報價與採購時程確認':'核定預算與採購時程','場地檔期與合約確認':'確認場地與進撤場'};
  return String(value||'').split(',').map(name=>ATTACHMENT_SHORT_NAME_BY_NAME[name]||aliases[name]||name).filter(Boolean).join(',');
}
function attachmentEvidenceFor(item){
  const name=String(item.milestoneName||'');
  if(/照片|攝影|錄影|畫面|素材|展品/.test(name))return '照片／影片檔或交付連結';
  if(/測試|彩排|驗收|查核|確認/.test(name))return '查核表、測試紀錄或核准截圖';
  if(/寄送|發送|通知|邀請/.test(name))return '寄送紀錄與收件名單';
  if(/名單|清單|通訊錄|座位|編號|配置|排程|流程|議程/.test(name))return '最新版清單或核准文件';
  if(/報價|預算|費用|合約|付款|保險/.test(name))return '報價、合約、憑證或核准紀錄';
  if(/網站|平台|連結|網路|直播/.test(name))return '網址、權限截圖或測試紀錄';
  if(/場地|場勘|布置|搭建|撤場|復原/.test(name))return '場地文件、點交紀錄或現場照片';
  return '核准文件、完成截圖或可追溯紀錄';
}
function attachmentSopFields(item){
  const required=Boolean(item.isCritical);
  return {
    applicability:required?'必做':'條件式',
    evidence:attachmentEvidenceFor(item),
    reviewer:required?'PM／主管':'PM',
    notApplicableRule:required
      ?'原則不得略過；確需排除時，須註明原因並取得主管核准'
      :'不適用時填寫原因，由 PM 確認後關閉'
  };
}
function attachmentPhaseFor(weeksBefore){
  const weeks=Number(weeksBefore||0);
  if(weeks>=9)return '立案啟動';
  if(weeks>=5)return '規劃確認';
  if(weeks>=2)return '執行籌備';
  if(weeks>0)return '行前準備';
  if(weeks===0)return '活動當天';
  return '結案追蹤';
}
const ATTACHMENT_CONSOLIDATION_GROUPS=[
  {name:'完成設備與網路整合測試',items:['測試麥克風','測試投影畫面','測試現場網路']},
  {name:'安排攝錄影',items:['安排攝影人員','安排錄影人員']},
  {name:'確認餐飲數量與特殊需求',items:['確認餐點數量','調查飲食需求']},
  {name:'完成布場盤點與留存',items:['清點布置物','拍攝布場驗收照']},
  {name:'完成撤場復原與物資回收',items:['完成場地復原','回收設備物資']},
  {name:'完成線上平台全流程測試',items:['測試講者連線','測試與會者流程','確認錄影設定']},
  {name:'規劃論文海報展示',items:['確認海報規格','建立海報編號','規劃論文海報展示']},
  {name:'完成論文海報展示準備',items:['準備海報工具','完成論文海報展示準備']}
];
function consolidateAttachmentTasks(items){
  const groupByItem=new Map();
  ATTACHMENT_CONSOLIDATION_GROUPS.forEach(group=>group.items.forEach(name=>groupByItem.set(name,group.name)));
  const combined=new Map();
  for(const item of items){
    const name=groupByItem.get(item.milestoneName)||item.milestoneName;
    const current=combined.get(name);
    if(!current){
      combined.set(name,{...item,milestoneName:name});
      continue;
    }
    const descriptions=[current.description,item.description].filter(Boolean);
    const evidences=[current.evidence,item.evidence].filter(Boolean);
    combined.set(name,{
      ...current,
      weeksBefore:Math.max(Number(current.weeksBefore||0),Number(item.weeksBefore||0)),
      isCritical:Boolean(current.isCritical||item.isCritical),
      applicability:(current.isCritical||item.isCritical)?'必做':'條件式',
      reviewer:(current.isCritical||item.isCritical)?'PM／主管':'PM',
      notApplicableRule:(current.isCritical||item.isCritical)
        ?'原則不得略過；確需排除時，須註明原因並取得主管核准'
        :'不適用時填寫原因，由 PM 確認後關閉',
      description:[...new Set(descriptions)].join('；'),
      evidence:[...new Set(evidences)].join('、')
    });
  }
  return [...combined.values()].map(item=>({...item,phase:attachmentPhaseFor(item.weeksBefore)}));
}
function attachmentTemplatesFor(eventType){
  const merged=[...ATTACHMENT_COMMON_TEMPLATES,...detailedAttachmentTasksFor(eventType),...(ATTACHMENT_TYPE_TEMPLATES[eventType]||[])];
  const normalized=merged.map(item=>{
      const sourceName=item.milestoneName;
      return {...item,eventType,milestoneName:ATTACHMENT_SHORT_NAME_BY_NAME[sourceName]||sourceName,
        category:ATTACHMENT_CATEGORY_BY_NAME[sourceName]||item.category||milestoneCategory(item),
        phase:attachmentPhaseFor(item.weeksBefore),
        affectedMilestones:shortAttachmentAffectedNames(item.affectedMilestones),
        ...attachmentSopFields(item)};
    });
  const unique=consolidateAttachmentTasks(normalized);
  const categoryOrder=new Map(MILESTONE_CATEGORIES.map((name,index)=>[name,index]));
  return unique
    .sort((a,b)=>
      Number(b.weeksBefore||0)-Number(a.weeksBefore||0) ||
      Number(Boolean(b.isCritical))-Number(Boolean(a.isCritical)) ||
      (categoryOrder.get(a.category)??999)-(categoryOrder.get(b.category)??999) ||
      String(a.milestoneName).localeCompare(String(b.milestoneName),'zh-Hant')
    )
    .map((item,index)=>({...item,sortOrder:index+1}));
}

    if(r.success && r.eventTypes && r.eventTypes.length){
      EVENT_TYPES = r.eventTypes.filter(t => t.active === true || t.active === 'TRUE')
        .sort((a,b)=>Number(a.sortOrder||999)-Number(b.sortOrder||999))
        .map(t => t.eventTypeName);
      APP._eventTypeObjects = r.eventTypes;
    }
  }catch(e){ console.warn('EventTypes load failed', e); }
  return EVENT_TYPES;
}

async function runTaskPool(tasks,limit=3){
  let cursor=0;
  async function worker(){
    while(cursor<tasks.length){
      const task=tasks[cursor++];
      await task();
    }
  }
  await Promise.all(Array.from({length:Math.min(limit,tasks.length)},worker));
}

async function applyAttachmentTemplateData(){
  if(APP.user?.role!=='Admin'){toast('warning','僅管理員可套用分類與模版');return;}
  const total=ATTACHMENT_EVENT_TYPES.reduce((sum,type)=>sum+attachmentTemplatesFor(type.eventTypeName).length,0);
  if(!confirm(
    `將依附件重整為 ${ATTACHMENT_EVENT_TYPES.length} 類活動、${total} 個可驗收待辦。\n\n`+
    '同名待辦會更新，附件未包含的舊模版會刪除；已建立專案的既有節點不受影響。\n'+
    '是否繼續？'
  ))return;
  ld(true);
  const summary={typesAdded:0,typesUpdated:0,templatesAdded:0,templatesUpdated:0,templatesDeleted:0};
  try{
    clearApiCache();
    const eventTypeResult=await doGet({action:'getEventTypes',token:APP.token});
    if(!eventTypeResult.success)throw new Error(eventTypeResult.error||'無法讀取活動類型');
    const currentTypes=eventTypeResult.eventTypes||[];
    for(const definition of ATTACHMENT_EVENT_TYPES){
      const existing=currentTypes.find(item=>item.eventTypeName===definition.eventTypeName);
      const data={...definition,active:true};
      const result=existing
        ? await doPost({action:'updateEventType',token:APP.token,eventTypeId:existing.eventTypeId,data},{clearCache:false})
        : await doPost({action:'addEventType',token:APP.token,data},{clearCache:false});
      if(!result.success)throw new Error(result.error||`無法更新「${definition.eventTypeName}」`);
      if(existing)summary.typesUpdated++;else summary.typesAdded++;
    }
    for(const definition of ATTACHMENT_EVENT_TYPES){
      const eventType=definition.eventTypeName;
      const existingResult=await fetchJson(
        `${GAS_URL}?${new URLSearchParams({action:'getTemplates',token:APP.token,eventType})}`,
        {method:'GET',redirect:'follow',cache:'no-store'}
      );
      if(!existingResult.success)throw new Error(existingResult.error||`無法讀取「${eventType}」模版`);
      const existingTemplates=existingResult.templates||[];
      const targets=attachmentTemplatesFor(eventType);
      const targetNames=new Set(targets.map(item=>item.milestoneName));
      const jobs=[];
      for(const data of targets){
        const existing=existingTemplates.find(item=>item.milestoneName===data.milestoneName);
        jobs.push(async()=>{
          const result=existing
            ? await doPost({action:'updateTemplate',token:APP.token,templateId:existing.templateId,data},{clearCache:false})
            : await doPost({action:'addTemplate',token:APP.token,data},{clearCache:false});
          if(!result.success)throw new Error(result.error||`無法更新「${eventType}／${data.milestoneName}」`);
          if(existing)summary.templatesUpdated++;else summary.templatesAdded++;
        });
      }
      await runTaskPool(jobs,3);
      const stale=existingTemplates.filter(item=>!targetNames.has(item.milestoneName));
      await runTaskPool(stale.map(item=>async()=>{
        const result=await doPost({action:'deleteTemplate',token:APP.token,templateId:item.templateId},{clearCache:false});
        if(!result.success)throw new Error(result.error||`無法移除舊模版「${item.milestoneName}」`);
        summary.templatesDeleted++;
      }),3);
    }
    clearApiCache();
    EVENT_TYPES=ATTACHMENT_EVENT_TYPES.map(item=>item.eventTypeName);
    APP._tmplFilter=EVENT_TYPES[0];
    document.getElementById('tab-type').dataset.loaded='';
    document.getElementById('tab-tmpl').dataset.loaded='';
    toast('success',`附件資料已套用：新增 ${summary.templatesAdded}、更新 ${summary.templatesUpdated}、移除舊模版 ${summary.templatesDeleted}`);
    loadEventTypeTab();
  }catch(error){
    clearApiCache();
    toast('danger','套用中斷：'+error.message);
  }finally{ld(false);}
}

function tmplWeekLabel(wb){
  const w = Number(wb);
  if(w === 0) return '<span class="bdg b-prog" style="font-size:10px">活動當天</span>';
  if(w < 0)   return `<span class="bdg b-norm" style="font-size:10px">活動後 ${Math.abs(w)} 週</span>`;
  if(w < 1)   return `<span class="bdg b-warn" style="font-size:10px">活動前 ${Math.round(w*7)} 天</span>`;
  return `<span class="bdg b-dang" style="font-size:10px">T-${w}週</span>`;
}

async function openTmplM(tid, defaultType, existing){
  await loadEventTypesToSelect('ft-et', defaultType || APP._tmplFilter || EVENT_TYPES[0]);
  document.getElementById('tmpl-ttl').textContent = tid ? '編輯模版節點' : '新增模版節點';
  document.getElementById('ft-id').value = tid || '';
  if(existing){
    document.getElementById('ft-n').value    = existing.milestoneName || '';
    document.getElementById('ft-et').value   = existing.eventType || defaultType || EVENT_TYPES[0];
    document.getElementById('ft-cat').value  = existing.category || milestoneCategory(existing);
    document.getElementById('ft-wb').value   = existing.weeksBefore || '';
    document.getElementById('ft-so').value   = existing.sortOrder || '';
    document.getElementById('ft-cr').checked = existing.isCritical === 'TRUE';
    document.getElementById('ft-rl').value   = existing.defaultRole || 'PM';
    document.getElementById('ft-desc').value = existing.description || '';
    document.getElementById('ft-af').value   = existing.affectedMilestones || '';
    // 編輯模式下鎖定活動類型（避免誤改）
    document.getElementById('ft-et').disabled = true;
  } else {
    ['ft-n','ft-desc','ft-af'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('ft-et').value   = defaultType || APP._tmplFilter || EVENT_TYPES[0];
    document.getElementById('ft-cat').value  = '專案統籌';
    document.getElementById('ft-et').disabled = false;
    document.getElementById('ft-wb').value   = '';
    document.getElementById('ft-so').value   = '';
    document.getElementById('ft-cr').checked = false;
    document.getElementById('ft-rl').value   = 'PM';
  }
  new bootstrap.Modal(document.getElementById('m-tmpl')).show();
}

async function submitTmpl(){
  const tid  = document.getElementById('ft-id').value;
  const name = document.getElementById('ft-n').value.trim();
  const et   = document.getElementById('ft-et').value;
  const wb   = document.getElementById('ft-wb').value;
  if(!name){toast('warning','請填寫節點名稱');return;}
  if(!et){toast('warning','請選擇活動類型');return;}
  if(wb===''||wb===null){toast('warning','請填寫完成時機（活動前幾週）');return;}

  const data = {
    milestoneName:      name,
    eventType:          et,
    category:           document.getElementById('ft-cat').value,
    weeksBefore:        Number(wb),
    isCritical:         document.getElementById('ft-cr').checked,
    defaultRole:        document.getElementById('ft-rl').value,
    description:        document.getElementById('ft-desc').value,
    affectedMilestones: document.getElementById('ft-af').value,
    sortOrder:          Number(document.getElementById('ft-so').value) || null
  };

  ld(true);
  try{
    const r = tid
      ? await doPost({action:'updateTemplate', token:APP.token, templateId:tid, data})
      : await doPost({action:'addTemplate',    token:APP.token, data});

    if(r.success){
      bootstrap.Modal.getInstance(document.getElementById('m-tmpl')).hide();
      toast('success', tid ? '模版節點已更新' : '模版節點已新增');
      document.getElementById('tab-tmpl').dataset.loaded = '';
      loadTmplTab(et);
    } else toast('danger', r.error);
  }finally{ld(false);}
}

async function delTmpl(tid, name){

  ld(true);
  try{
    const r = await doPost({action:'deleteTemplate', token:APP.token, templateId:tid});
    if(r.success){
      toast('success','模版節點已刪除');
      document.getElementById('tab-tmpl').dataset.loaded = '';
      loadTmplTab(APP._tmplFilter);

  }finally{ld(false);}
}

// 複製節點到其他活動類型
async function dupTmpl(tid){
  const target = prompt('請輸入要複製到的活動類型：\n\n' + EVENT_TYPES.join(' / '));
  if(!target) return;
  if(!EVENT_TYPES.includes(target)){toast('warning','活動類型名稱不正確');return;}

  // 先取得原始模版資料
  const r = await doGet({action:'getTemplates', token:APP.token, eventType:APP._tmplFilter});
  if(!r.success){toast('danger',r.error);return;}
  const orig = r.templates.find(t=>t.templateId===tid);
  if(!orig){toast('danger','找不到原始模版');return;}

  ld(true);
  try{
    const r2 = await doPost({action:'addTemplate', token:APP.token, data:{
      ...orig, eventType:target, templateId:undefined
    }});
    if(r2.success){
      toast('success',`已複製至「${target}」`);
    } else toast('danger', r2.error);
  }finally{ld(false);}
}

function renderDatePickers(presetDates){
  var wrap = document.getElementById('fp-dates-wrap');
  var days = parseInt(document.getElementById('fp-dy').value)||1;
  if(days<1){days=1;document.getElementById('fp-dy').value=1;}
  if(days>20){days=20;document.getElementById('fp-dy').value=20;}
  var isMulti = document.getElementById('fp-multi').checked;
  var modeTag = isMulti
    ? '<span class="dates-mode-tag multi"><i class="bi bi-calendar-week me-1"></i>多梯次 — 請個別選擇各梯日期</span>'
    : '<span class="dates-mode-tag continuous"><i class="bi bi-calendar-range me-1"></i>連續多天 — 自動帶入後續日期</span>';
  var items = '';
  for(var i=0;i<days;i++){
    var labelClass = isMulti ? 'multi' : '';
    var labelText  = days===1 ? '活動日期' : (isMulti ? '第 '+(i+1)+' 梯' : '第 '+(i+1)+' 天');
    var preVal = (presetDates && presetDates[i]) ? presetDates[i] : '';
    items += '<div class="date-picker-item" id="fp-date-item-'+i+'">'+
      '<span class="date-picker-label '+labelClass+'">'+labelText+'</span>'+
      '<input type="date" id="fp-date-'+i+'" class="form-control" value="'+preVal+'"'+
      (isMulti?'':' oninput="onContinuousDateChange('+i+')"')+' />'+
      '</div>';
  }
  wrap.innerHTML = (days>1?modeTag:'') + '<div class="date-pickers-grid">'+items+'</div>';
}

function onContinuousDateChange(idx){
  var baseVal = document.getElementById('fp-date-'+idx);
  if(!baseVal||!baseVal.value) return;
  var base = new Date(baseVal.value);
  var days = parseInt(document.getElementById('fp-dy').value)||1;
  for(var i=idx+1;i<days;i++){
    base.setDate(base.getDate()+1);
    var el = document.getElementById('fp-date-'+i);
    if(el) el.value = base.toISOString().split('T')[0];
  }
}

function getEventDates(){
  var days = parseInt(document.getElementById('fp-dy').value)||1;
  var dates = [];
  for(var i=0;i<days;i++){
    var el = document.getElementById('fp-date-'+i);
    if(el && el.value) dates.push(el.value);
    else dates.push('');
  }
  return dates;
}

function getFirstEventDate(){
  var dates = getEventDates();
  return dates.length>0 ? dates[0] : '';
}

async function submitProj(){
  if(PROJECT_SUBMIT_IN_FLIGHT)return;
  if(PROJECT_SUBMIT_UNCERTAIN){
    bootstrap.Modal.getInstance(document.getElementById('m-proj'))?.hide();
    nav('projects');
    toast('warning','請先確認專案列表；若沒有新專案，再重新送出');
    return;
  }
  const pid=document.getElementById('fp-id').value;
  const isEdit=!!pid;
  const n=document.getElementById('fp-n').value.trim();
  const c=document.getElementById('fp-c').value.trim();
  const t=document.getElementById('fp-t').value;
  if(!n||!c){toast('warning','請填寫專案名稱與客戶名稱');return;}
  if(!isEdit&&!t){toast('warning','請選擇活動類型');return;}
  const eventDatesArr=getEventDates();
  const firstDate=getFirstEventDate();
  const isMultiSession=document.getElementById('fp-multi').checked;
  const data={
    projectName:n, clientName:c, eventType:t,
    eventDate:firstDate,
    eventDates:JSON.stringify(eventDatesArr),
    isMultiSession:isMultiSession?'TRUE':'FALSE',
    location:document.getElementById('fp-l').value,
    eventDays:document.getElementById('fp-dy').value,
    estimatedAttendees:document.getElementById('fp-a').value,
    pmName:document.getElementById('fp-pm').value,
    hasForeignGuests:document.getElementById('fp-fg').checked?'TRUE':'FALSE',
    needsAccommodation:document.getElementById('fp-ac').checked?'TRUE':'FALSE',
    needsFlightOrFerry:document.getElementById('fp-fl').checked?'TRUE':'FALSE',
    needsTransfer:document.getElementById('fp-tr').checked?'TRUE':'FALSE',
    needsMedia:document.getElementById('fp-md').checked?'TRUE':'FALSE',
    notes:document.getElementById('fp-nt').value
  };
  if(isEdit) data.projectStatus=document.getElementById('fp-st').value;
  const submitBtn=document.getElementById('btn-submit-proj');
  const submitStatus=document.getElementById('proj-submit-status');
  const defaultButtonHtml=submitBtn.innerHTML;
  PROJECT_SUBMIT_IN_FLIGHT=true;
  submitBtn.disabled=true;
  submitBtn.setAttribute('aria-busy','true');
  submitBtn.innerHTML=`<span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>${isEdit?'儲存中':'建立中'}，請勿重複送出`;
  submitStatus.textContent=isEdit?'正在儲存變更…':'正在建立專案與預設節點，可能需要一些時間…';
  try{
    const requestId=createRequestId();
    const r=isEdit
      ? await doPost({action:'updateProject',token:APP.token,projectId:pid,data,requestId},{timeoutMs:45000})
      : await doPost({action:'createProject',token:APP.token,data,requestId},{timeoutMs:90000});
    if(r.success){
      bootstrap.Modal.getInstance(document.getElementById('m-proj')).hide();
      document.getElementById('fp-t').disabled=false;
      if(isEdit){
        // 若活動日期有變更，詢問是否同步重算節點日期
        if(r.dateChanged && r.newEventDate){
          const doRecalc = confirm(
            '活動日期已變更！\n\n' +
            '是否自動重算所有未完成節點的計畫日期？\n' +
            '（已完成的節點不受影響）\n\n' +
            '選「確定」→ 自動重算\n' +
            '選「取消」→ 保留原有節點日期'
          );
          if(doRecalc){
            await _recalcMsDates(pid, r.newEventDate);
            return; // _recalcMsDates 內會 reload
          }
        }
        toast('success','專案資料已更新');
        if(APP.page==='proj-detail') loadDetail(pid); else loadProjs();
      } else {
        toast('success','專案建立成功！節點已自動產生');
        nav('proj-detail',r.projectId);
      }
    } else{
      submitStatus.textContent='伺服器未完成操作，請依提示修正後再試。';
      toast('danger',r.error||'操作失敗，資料尚未送出');
    }
  }catch(e){
    if(e.code==='TIMEOUT'){
      PROJECT_SUBMIT_UNCERTAIN=true;
      submitStatus.textContent='伺服器仍可能已完成建立，請先到專案列表確認，避免重複新增。';
      submitBtn.innerHTML='<i class="bi bi-list-check me-1"></i>前往專案列表確認';
      toast('warning','等待伺服器回覆逾時；請先確認專案列表，避免重複送出');
    }else{
      submitStatus.textContent='送出失敗，請確認網路後再試。';
      toast('danger','連線失敗：'+e.message);
    }
  }finally{
    PROJECT_SUBMIT_IN_FLIGHT=false;
    submitBtn.removeAttribute('aria-busy');
    submitBtn.disabled=false;
    if(!PROJECT_SUBMIT_UNCERTAIN)submitBtn.innerHTML=defaultButtonHtml;
  }
}

// ★ API 呼叫工具（CORS 修正版）
// ============================================================
const GET_INFLIGHT=new Map();
const GET_CACHE=new Map();
let FORCE_API_REFRESH_UNTIL=0,API_CACHE_EPOCH=0;
const API_CACHE_TTL={
  getEventTypes:1800000,getUsers:600000,getTemplates:600000,
  getProjects:300000,getProjectDetail:120000,getDashboardData:60000,
  getResources:120000,getClosedProjects:300000,getWorkload:60000,
  getProjectStats:120000,getGanttData:120000,getProjectRiskReport:60000,
  getLogs:10000,getUserWorkload:8000,calculateDelayImpact:8000,smartAssign:5000
};
const SESSION_API_CACHE_KEY='mcs_api_cache_v2';
const SESSION_CACHE_ACTIONS=new Set(['getEventTypes','getUsers','getTemplates','getProjects','getProjectDetail','getDashboardData','getResources','getClosedProjects','getWorkload','getProjectStats','getGanttData','getProjectRiskReport']);
let SESSION_API_CACHE=null,SESSION_CACHE_WRITE_TIMER=0;
function apiUserScope(){return String(APP.user?.userId||APP.user?.username||APP.user?.displayName||'anonymous');}
function apiSessionKey(params){
  const clean=Object.keys(params).filter(key=>key!=='token').sort().reduce((out,key)=>(out[key]=params[key],out),{});
  return `${apiUserScope()}|${JSON.stringify(clean)}`;
}
function sessionApiCache(){
  if(SESSION_API_CACHE)return SESSION_API_CACHE;
  try{SESSION_API_CACHE=JSON.parse(sessionStorage.getItem(SESSION_API_CACHE_KEY)||'{}');}
  catch{SESSION_API_CACHE={};}
  return SESSION_API_CACHE;
}
function flushSessionApiCache(){
  if(SESSION_CACHE_WRITE_TIMER){clearTimeout(SESSION_CACHE_WRITE_TIMER);SESSION_CACHE_WRITE_TIMER=0;}
  try{sessionStorage.setItem(SESSION_API_CACHE_KEY,JSON.stringify(SESSION_API_CACHE||{}));}catch{}
}
function scheduleSessionCacheWrite(){
  if(SESSION_CACHE_WRITE_TIMER)return;
  const write=()=>{SESSION_CACHE_WRITE_TIMER=0;flushSessionApiCache();};
  SESSION_CACHE_WRITE_TIMER=setTimeout(write,250);
}
function readSessionApiCache(params){
  if(!SESSION_CACHE_ACTIONS.has(params.action))return null;
  const store=sessionApiCache(),key=apiSessionKey(params),entry=store[key];
  if(!entry||Date.now()-entry.cachedAt>=apiCacheTtl(params.action)){
    if(entry){delete store[key];scheduleSessionCacheWrite();}
    return null;
  }
  return entry;
}
function writeSessionApiCache(params,data){
  if(!SESSION_CACHE_ACTIONS.has(params.action))return;
  const store=sessionApiCache();
  store[apiSessionKey(params)]={data,cachedAt:Date.now()};
  const entries=Object.entries(store);
  if(entries.length>30){
    entries.sort((a,b)=>b[1].cachedAt-a[1].cachedAt).slice(30).forEach(([key])=>delete store[key]);
  }
  scheduleSessionCacheWrite();
}
function clearApiCache(){
  API_CACHE_EPOCH++;GET_CACHE.clear();GET_INFLIGHT.clear();
  SESSION_API_CACHE={};
  if(SESSION_CACHE_WRITE_TIMER){clearTimeout(SESSION_CACHE_WRITE_TIMER);SESSION_CACHE_WRITE_TIMER=0;}
  try{sessionStorage.removeItem(SESSION_API_CACHE_KEY);}catch{}
}
addEventListener('pagehide',()=>{if(SESSION_CACHE_WRITE_TIMER)flushSessionApiCache();});
function apiCacheTtl(action){return API_CACHE_TTL[action]??20000;}
function trimApiCache(){
  if(GET_CACHE.size<=80)return;
  [...GET_CACHE.entries()].sort((a,b)=>a[1].cachedAt-b[1].cachedAt).slice(0,GET_CACHE.size-80).forEach(([key])=>GET_CACHE.delete(key));
}
async function fetchJson(url,options,timeoutMs=20000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{
    const res=await fetch(url,{...options,signal:controller.signal});
    if(!res.ok){
      const httpError=new Error(`伺服器暫時無法處理（HTTP ${res.status}）`);
      httpError.code=res.status>=500?'SERVER_ERROR':'HTTP_ERROR';
      throw httpError;
    }
    const txt=await res.text();
    try{return JSON.parse(txt);}catch{throw new Error('伺服器回應格式錯誤，請稍後再試');}
  }catch(e){
    if(e.name==='AbortError'){
      const timeoutError=new Error('伺服器回覆逾時');
      timeoutError.code='TIMEOUT';
      throw timeoutError;
    }
    throw e;
  }finally{clearTimeout(timer);}
}
async function fetchGetWithRetry(url,options,timeoutMs=20000){
  try{return await fetchJson(url,options,timeoutMs);}
  catch(error){
    const retryable=error.code==='SERVER_ERROR'||(!error.code&&error instanceof TypeError);
    if(!retryable)throw error;
    await new Promise(resolve=>setTimeout(resolve,350));
    return fetchJson(url,options,timeoutMs);
  }
}
function doGet(params){
  const qs=new URLSearchParams(params).toString();
  const url=`${GAS_URL}?${qs}`;
  const now=Date.now(),force=now<FORCE_API_REFRESH_UNTIL;
  const cached=GET_CACHE.get(url);
  if(!force&&cached&&now-cached.cachedAt<apiCacheTtl(params.action))return Promise.resolve(cached.data);
  const sessionCached=!force&&readSessionApiCache(params);
  if(sessionCached){GET_CACHE.set(url,sessionCached);return Promise.resolve(sessionCached.data);}
  if(GET_INFLIGHT.has(url)) return GET_INFLIGHT.get(url);
  const requestEpoch=API_CACHE_EPOCH;
  const request=fetchGetWithRetry(url,{method:'GET',redirect:'follow',cache:'no-store'})
    .then(data=>{
      if(requestEpoch===API_CACHE_EPOCH&&data&&data.success!==false){
        GET_CACHE.set(url,{data,cachedAt:Date.now()});trimApiCache();writeSessionApiCache(params,data);
      }
      return data;
    })
    .finally(()=>GET_INFLIGHT.delete(url));
  GET_INFLIGHT.set(url,request);
  return request;
}
async function doPost(body,{timeoutMs=30000,clearCache:shouldClearCache=true}={}){
  const result=await fetchJson(GAS_URL,{
    method:'POST',redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body)
  },timeoutMs);
  if(result&&result.success&&shouldClearCache)clearApiCache();
  return result;
}

function fdDates(p){
  if(p.eventDates){
    try{
      var arr=JSON.parse(p.eventDates).filter(function(d){return d;});
      if(arr.length>1){
        if(p.isMultiSession==='TRUE'){
          return arr.map(function(d,i){return '第'+(i+1)+'梯 '+fd(d);}).join('　');
        } else {
          return fd(arr[0])+' ～ '+fd(arr[arr.length-1])+' ('+arr.length+'天)';
        }
      }
      if(arr.length===1) return fd(arr[0]);
    }catch(e){}
  }
  return fd(p.eventDate)||'日期待定';
}
let LOADING_COUNT=0,LOADING_TIMER=null;
function ld(show){
  const id='__ld';
  LOADING_COUNT=Math.max(0,LOADING_COUNT+(show?1:-1));
  const page=document.getElementById('page');
  if(page)page.setAttribute('aria-busy',String(LOADING_COUNT>0));
  if(LOADING_COUNT>0&&!document.getElementById(id)&&!LOADING_TIMER){
    LOADING_TIMER=setTimeout(()=>{
      LOADING_TIMER=null;if(LOADING_COUNT===0||document.getElementById(id))return;
      const el=document.createElement('div');
      el.id=id;el.className='ld-ov';el.setAttribute('role','status');el.setAttribute('aria-live','polite');
      el.innerHTML='<div class="ld-box"><div class="ld-ring"></div><span>資料載入中…</span></div>';
      document.body.appendChild(el);
    },180);
  }else if(LOADING_COUNT===0){
    if(LOADING_TIMER){clearTimeout(LOADING_TIMER);LOADING_TIMER=null;}
    const el=document.getElementById(id);if(el)el.remove();
  }
}
function toast(type,msg){
  const ex=document.querySelector('.t-msg');if(ex)ex.remove();
  const ic={success:'check-circle-fill',danger:'x-circle-fill',warning:'exclamation-triangle-fill'};
  const el=document.createElement('div');
  el.className=`alert alert-${type} alert-dismissible t-msg`;
  el.setAttribute('role','status');el.setAttribute('aria-live','polite');
  el.innerHTML=`<i class="bi bi-${ic[type]||'info-circle'} me-2"></i>${esc(msg)}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="關閉"></button>`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),4500);
}

async function _recalcMsDates(pid, newEventDate){
  ld(true);
  try{
    const r = await doPost({
      action:       'recalcMilestoneDates',
      token:        APP.token,
      projectId:    pid,
      newEventDate: newEventDate
    });
    if(r.success){
      // 顯示結果摘要
      const skippedNames = r.details
        .filter(d => d.action === 'skip')
        .map(d => `・${d.name}（${d.reason}）`)
        .join('\n');

      let msg = `節點日期已重算完成！\n\n✅ 已更新：${r.updated} 個節點`;
      if(r.skipped > 0){
        msg += `\n⏭ 跳過：${r.skipped} 個節點`;
        if(skippedNames) msg += `\n${skippedNames}`;
      }
      toast('success', `節點日期重算完成：${r.updated} 個已更新`);
      // 重新載入詳細頁
      if(APP.page === 'proj-detail') loadDetail(pid);
      else loadProjs();
    } else {
      toast('danger', '節點日期重算失敗：' + (r.error || '未知錯誤'));
      if(APP.page === 'proj-detail') loadDetail(pid);
      else loadProjs();
    }
  } catch(e){
    toast('danger', '重算失敗：' + e.message);
  } finally {
    ld(false);
  }
}

/**
 * 在節點列表的名稱欄下方展開行內備註編輯器
 * @param {string} mid  milestoneId
 * @param {string} pid  projectId
 * @param {HTMLElement} btn 觸發的按鈕元素
 */
function openNoteEdit(mid, pid, btn) {
  // 找到名稱欄 <td>
  const td = btn.closest('td');
  if (!td) return;

  // 若已有編輯器，就關閉
  const existing = td.querySelector('.note-inline-editor-wrap');
  if (existing) { existing.remove(); return; }

  // 取得目前備註內容（從 .ms-note-row 的 span 或空字串）
  const noteSpan = td.querySelector('.ms-note-row span');
  const current  = noteSpan ? noteSpan.textContent.trim() : '';

  // 建立行內編輯器
  const wrap = document.createElement('div');
  wrap.className = 'note-inline-editor-wrap';
  wrap.style.cssText = 'margin-top:6px';

  wrap.innerHTML = `
    <textarea class="note-inline-editor" placeholder="輸入備註（PM 工作日誌、注意事項、決策記錄…）" rows="3">${current}</textarea>
    <div style="display:flex;gap:4px;margin-top:4px;justify-content:flex-end">
      <button class="btn btn-sm btn-secondary" style="font-size:11px;padding:2px 10px"
              onclick="this.closest('.note-inline-editor-wrap').remove()">取消</button>
      <button class="btn-ac" style="font-size:11px;padding:3px 12px"
              onclick="saveNoteInline('${mid}','${pid}',this)">
        <i class="bi bi-save me-1"></i>儲存
      </button>
    </div>
  `;

  td.appendChild(wrap);
  wrap.querySelector('textarea').focus();

  // Enter+Ctrl 快捷儲存
  wrap.querySelector('textarea').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      saveNoteInline(mid, pid, wrap.querySelector('button.btn-ac'));
    }
    if (e.key === 'Escape') wrap.remove();
  });
}

/**
 * 儲存行內編輯的備註
 */
async function saveNoteInline(mid, pid, saveBtn) {
  const wrap    = saveBtn.closest('.note-inline-editor-wrap');
  const textarea = wrap.querySelector('textarea');
  const newNote  = textarea.value.trim();

  // 暫時停用按鈕
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<i class="bi bi-hourglass-split"></i>';

  try {
    const r = await doPost({
      action:      'updateMilestone',
      token:       APP.token,
      milestoneId: mid,
      data:        { notes: newNote }
    });

    if (r.success) {
      toast('success', '備註已儲存');
      wrap.remove();
      // 重新載入詳細頁以更新顯示
      loadDetail(pid);
    } else {
      toast('danger', '備註儲存失敗：' + (r.error || '未知錯誤'));
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<i class="bi bi-save me-1"></i>儲存';
    }
  } catch(e) {
    toast('danger', '連線失敗：' + e.message);
    saveBtn.disabled = false;
    saveBtn.innerHTML = '<i class="bi bi-save me-1"></i>儲存';
  }
}

// 快取：人員清單（Modal 開啟時載入一次）
let _userCache = null;

/**
 * 載入人員清單到 fm-uid 下拉選單
 */
async function loadUsersToSelect(selectId, selectedUserId) {
  const sel = document.getElementById(selectId);
  if (!sel) return;

  // 若有快取就用快取
  if (!_userCache) {
    try {
      const r = await doGet({ action: 'getUsers', token: APP.token });
      if (r.success) _userCache = r.users;
    } catch(e) { return; }
  }

  // 重建選項
  sel.innerHTML = '<option value="">未指派</option>';
  if (_userCache) {
    _userCache
      .filter(u => u.role !== 'Viewer' && (u.active === true || u.active === 'TRUE'))
      .forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.userId;
        opt.textContent = `${u.displayName}（${u.role}）`;
        if (u.userId === selectedUserId) opt.selected = true;
        sel.appendChild(opt);
      });
  }
}

/**

 */
async function refreshAssignHint() {
  const uid = document.getElementById('fm-uid')?.value;
  const hint = document.getElementById('fm-assign-hint');
  if (!hint) return;
  if (!uid) { hint.textContent = ''; return; }

  try {
    const r = await doGet({ action: 'getUserWorkload', token: APP.token, targetUserId: uid });
    if (r.success) {
      const w = r.user;
      const color = w.loadRate >= 90 ? 'var(--danger)' : w.loadRate >= 60 ? 'var(--warning)' : 'var(--success)';
      hint.innerHTML = `<span style="color:${color}">負荷：${w.loadRate}% ｜ 進行中節點：${w.activeMs} 個</span>`;

  } catch(e) {}
}

let _sortMode=false,_sortProjId=null,_dragSrcEl=null;
function toggleSortMode(pid){
  _sortMode=!_sortMode; _sortProjId=pid;
  const btn=document.getElementById('btn-sort-mode');
  const list=document.querySelector('tbody.ms-list-wrap');
  const banner=document.getElementById('sort-banner');
  if(!list)return;
  if(_sortMode){
    list.classList.add('sort-mode');
    if(btn)btn.classList.add('active');
    if(banner)banner.style.display='flex';
    list.querySelectorAll('tr[data-mid]').forEach(row=>row.setAttribute('draggable','true'));
    filterMilestoneList();
    bindDragEvents(list);
  } else { exitSortMode(false); }
}
function exitSortMode(reload){
  _sortMode=false;
  const btn=document.getElementById('btn-sort-mode');
  const list=document.querySelector('tbody.ms-list-wrap');
  const banner=document.getElementById('sort-banner');
  if(list){
    list.classList.remove('sort-mode');
    list.querySelectorAll('tr[data-mid]').forEach(row=>{row.setAttribute('draggable','false');row.classList.remove('dragging','drag-over');});
  }
  if(btn)btn.classList.remove('active');
  if(banner)banner.style.display='none';
  filterMilestoneList();
  if(reload) loadDetail(_sortProjId||APP.proj);
}
function bindDragEvents(container){
  container.querySelectorAll('tr[data-mid]').forEach(row=>{
    row.addEventListener('dragstart',onDragStart);
    row.addEventListener('dragover',onDragOver);
    row.addEventListener('dragleave',onDragLeave);
    row.addEventListener('drop',onDrop);
    row.addEventListener('dragend',onDragEnd);
  });
}
function onDragStart(e){_dragSrcEl=this;this.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',this.dataset.mid);}
function onDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';if(this===_dragSrcEl)return;this.classList.add('drag-over');}
function onDragLeave(){this.classList.remove('drag-over');}
function onDrop(e){
  e.stopPropagation();e.preventDefault();this.classList.remove('drag-over');
  if(!_dragSrcEl||_dragSrcEl===this)return;
  const parent=this.parentNode;if(!parent)return;
  const srcIdx=[...parent.children].indexOf(_dragSrcEl);
  const tgtIdx=[...parent.children].indexOf(this);
  if(srcIdx<tgtIdx){parent.insertBefore(_dragSrcEl,this.nextSibling);}else{parent.insertBefore(_dragSrcEl,this);}
  updateSortBadges(parent);
}
function onDragEnd(){document.querySelectorAll('.ms-tr').forEach(r=>r.classList.remove('dragging','drag-over'));_dragSrcEl=null;}
function updateSortBadges(container){let i=1;container.querySelectorAll('tr[data-mid]').forEach(row=>{const b=row.querySelector('.sort-badge');if(b)b.textContent=i;i++;});}
function moveMsUp(mid){const list=document.querySelector('tbody.ms-list-wrap');if(!list)return;const rows=[...list.querySelectorAll('tr[data-mid]')];const idx=rows.findIndex(r=>r.dataset.mid===mid);if(idx<=0)return;list.insertBefore(rows[idx],rows[idx-1]);updateSortBadges(list);}
function moveMsDown(mid){const list=document.querySelector('tbody.ms-list-wrap');if(!list)return;const rows=[...list.querySelectorAll('tr[data-mid]')];const idx=rows.findIndex(r=>r.dataset.mid===mid);if(idx<0||idx>=rows.length-1)return;list.insertBefore(rows[idx+1],rows[idx]);updateSortBadges(list);}
async function saveSortOrder(){
  const list=document.querySelector('tbody.ms-list-wrap');
  const pid=_sortProjId||APP.proj;
  if(!list||!pid){toast('warning','無法取得專案 ID，請重新整理後再試');return;}
  _sortProjId=pid;
  const rows=[...list.querySelectorAll('tr[data-mid]')];
  const orderedIds=rows.map((row,i)=>({milestoneId:row.dataset.mid,sortOrder:(i+1)*10}));
  if(orderedIds.length===0){exitSortMode(false);return;}
  ld(true);
  try{
    const r=await doPost({action:'reorderMilestones',token:APP.token,orderedIds:orderedIds});
    if(r.success){toast('success',`排序已儲存（${r.updated} 個節點更新）`);exitSortMode(true);}
    else toast('danger','排序儲存失敗：'+(r.error||'未知錯誤'));
  }catch(e){toast('danger','連線失敗：'+e.message);}
  finally{ld(false);}
}

        <div class="card">

              <thead style="background:var(--n100)"><tr><th class="ps-3">角色</th><th>總節點</th><th>已完成</th><th>延遲/卡關</th><th>完成率</th></tr></thead>

                  <td><div style="display:flex;align-items:center;gap:6px">
                    <div style="flex:1;height:6px;background:var(--n200);border-radius:99px;overflow:hidden;min-width:50px">
                      <div style="height:100%;border-radius:99px;background:var(--accent);width:${data.total>0?Math.round(data.done/data.total*100):0}%"></div>
                    </div>
                    <span class="font-mono" style="font-size:11px">${data.total>0?Math.round(data.done/data.total*100):0}%</span>
                  </div></td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="card mb-3">
          <div class="card-hdr" style="border-left:3px solid var(--danger)"><span style="color:var(--danger)"><i class="bi bi-clock-history me-2"></i>延遲排行 TOP5</span></div>
          ${dl.length===0?`<div class="p-3 text-center" style="font-size:12px;color:var(--success)"><i class="bi bi-check-circle me-1"></i>目前無延遲節點</div>`:
            dl.map((m,i)=>`<div style="padding:10px 16px;border-bottom:1px solid var(--n200);display:flex;align-items:center;gap:10px">

              ${rs.resExpiring>0?`<div style="font-size:11px;color:var(--warning);margin-top:4px"><i class="bi bi-exclamation-triangle me-1"></i>${rs.resExpiring} 項資源14日內到期</div>`:''}
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-hdr"><span><i class="bi bi-lightning me-2"></i>快速行動</span></div>
          <div class="card-body p-3 d-flex flex-column gap-2">
            <button class="btn-ac w-100" onclick="nav('proj-detail','${pid}')"><i class="bi bi-list-check"></i>查看節點清單</button>
            <button class="btn-ac w-100" style="background:#444" onclick="nav('delay-sim','')"><i class="bi bi-exclamation-triangle"></i>延遲影響模擬</button>
            <button class="btn-ac w-100" style="background:#2a5298" onclick="nav('gantt','${pid}')"><i class="bi bi-bar-chart-steps"></i>甘特圖</button>

        </div>

  }catch(e){toast('danger','載入失敗：'+e.message);}

}
