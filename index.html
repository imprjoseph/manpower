<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>imPR MCS 節點控管系統</title>
  <meta name="theme-color" content="#171717" />
  <meta name="description" content="imPR 會展專案節點與人力控管系統" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root {
      --impr-orange: #E8610A;
      --accent:      #E8610A;
      --accent-lt:   #f08040;
      --accent-pale: rgba(232,97,10,.1);
      --success:     #2ec4b6;
      --warning:     #ffb703;
      --danger:      #e63946;
      --danger-dk:   #9b1e26;
      --n100: #f7f7f7; --n200: #ebebeb; --n300: #d0d0d0;
      --n500: #888; --n700: #444; --n900: #1a1a1a;
      --sidebar-w: 250px; --topbar-h: 56px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
      --r: 8px;
      --sh: 0 1px 3px rgba(0,0,0,.1);
      --shm: 0 4px 12px rgba(0,0,0,.12);
      --shl: 0 8px 28px rgba(0,0,0,.18);
      --tr: .18s ease;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--n100);color:var(--n900);overflow-x:hidden;line-height:1.5;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit}
    :focus-visible{outline:3px solid rgba(232,97,10,.28);outline-offset:2px}
    #app-shell{display:flex;min-height:100vh}

    /* SIDEBAR */
    #sidebar{width:var(--sidebar-w);min-height:100vh;background:#111;display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;border-right:1px solid rgba(232,97,10,.2)}
    .sb-brand{height:64px;padding:0 18px;border-bottom:1px solid rgba(232,97,10,.2);background:#000;display:flex;align-items:center}
    .brand-lockup{display:flex;align-items:center;gap:10px;color:#fff;line-height:1}
    .brand-mark{color:var(--accent);font-size:30px;font-weight:900;letter-spacing:-2px}
    .brand-copy{display:flex;flex-direction:column;gap:4px}
    .brand-name{font-size:12px;font-weight:700;letter-spacing:.8px}
    .brand-sub{font-size:9px;color:#777;letter-spacing:1.2px;text-transform:uppercase}
    .sb-nav{flex:1;padding:12px 0;overflow-y:auto}
    .nav-sec{padding:10px 18px 4px;font-size:9px;font-weight:700;letter-spacing:2px;color:#555;text-transform:uppercase}
    .nav-a{width:100%;display:flex;align-items:center;gap:10px;padding:10px 20px;color:rgba(255,255,255,.55);cursor:pointer;border:0;border-left:3px solid transparent;background:transparent;text-align:left;transition:color var(--tr),background var(--tr),border-color var(--tr);font:inherit;font-size:13.5px}
    .nav-a:hover{color:#fff;background:rgba(232,97,10,.08)}
    .nav-a.act{color:var(--accent);background:rgba(232,97,10,.12);border-left-color:var(--accent)}
    .nav-a i{font-size:16px;width:20px;text-align:center}
    .sb-user{padding:14px 18px;border-top:1px solid rgba(232,97,10,.2);display:flex;align-items:center;gap:10px;background:rgba(232,97,10,.05)}
    .u-ava{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
    .u-name{color:#fff;font-size:13px;font-weight:500}
    .u-role{color:var(--accent);font-size:10px;letter-spacing:.5px}
    .btn-out{background:none;border:none;color:#555;cursor:pointer;font-size:16px;transition:color var(--tr)}
    .btn-out:hover{color:var(--danger)}

    /* MAIN */
    #main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column}
    #topbar{height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--n200);padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--sh)}
    .top-title{font-size:16px;font-weight:700;color:var(--n900)}
    .top-meta{font-size:11px;color:var(--n500);margin-top:1px}
    #page{padding:24px;flex:1;width:100%;max-width:1680px;margin:0 auto}
    .top-refresh{width:auto;padding:0 10px;gap:6px}
    .top-refresh-label{font-size:12px;font-weight:650}

    /* LOGIN */
    #login{display:grid;place-items:center;min-height:100dvh;background:#f5f5f4;position:fixed;inset:0;z-index:999;padding:24px;overflow:auto}
    .lg-bg{position:absolute;inset:0;background:
      radial-gradient(circle at 15% 10%,rgba(232,97,10,.11),transparent 34%),
      linear-gradient(135deg,#fafaf9 0%,#f5f5f4 100%)}
    .lg-box{background:#fff;border:1px solid #e7e5e4;border-radius:18px;padding:34px;width:min(100%,420px);box-shadow:0 20px 60px rgba(28,25,23,.1);position:relative;z-index:1}
    .lg-brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}
    .lg-brand .brand-mark{font-size:40px}
    .lg-brand-title{font-size:17px;font-weight:750;color:#1c1917;letter-spacing:.1px}
    .lg-brand-sub{font-size:12px;color:#78716c;margin-top:5px}
    .lg-lbl{display:block;font-size:12px;font-weight:650;color:#44403c;margin-bottom:7px}
    .lg-inp{width:100%;background:#fff;border:1.5px solid #d6d3d1;border-radius:10px;padding:12px 14px;font-size:15px;color:#1c1917;font-family:var(--font);outline:none;transition:border-color var(--tr),box-shadow var(--tr)}
    .lg-inp::placeholder{color:#a8a29e}
    .lg-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,97,10,.12)}
    .lg-password{position:relative}
    .lg-password .lg-inp{padding-right:48px}
    .lg-password-toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:#78716c;display:grid;place-items:center;cursor:pointer}
    .lg-password-toggle:hover{background:#f5f5f4;color:var(--accent)}
    .btn-lg{width:100%;min-height:46px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;transition:background var(--tr),box-shadow var(--tr);letter-spacing:.2px}
    .btn-lg:hover{background:#cf5205;box-shadow:0 5px 18px rgba(232,97,10,.24)}
    .btn-lg:disabled{opacity:.65;cursor:wait;box-shadow:none}
    .login-note{font-size:11px;color:#a8a29e;text-align:center;margin-top:18px}
    #lerr{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;font-size:12px;padding:9px 11px;margin-top:12px;display:none}

    /* CARDS */
    .card{background:#fff;border:1px solid var(--n200);border-radius:var(--r);box-shadow:var(--sh)}
    .card-hdr{padding:14px 20px;border-bottom:1px solid var(--n200);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:var(--r) var(--r) 0 0}

    /* STAT */
    .stat{background:#fff;border:1px solid var(--n200);border-radius:var(--r);padding:20px;display:flex;align-items:flex-start;gap:16px;box-shadow:var(--sh);transition:transform var(--tr),box-shadow var(--tr)}
    .stat:hover{transform:translateY(-2px);box-shadow:var(--shm)}
    .stat-ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
    .ic-or{background:rgba(232,97,10,.1);color:var(--accent)}
    .ic-gr{background:rgba(46,196,182,.1);color:var(--success)}
    .ic-ye{background:rgba(255,183,3,.1);color:var(--warning)}
    .ic-re{background:rgba(230,57,70,.1);color:var(--danger)}
    .stat-v{font-size:30px;font-weight:800;line-height:1;color:var(--n900);font-family:var(--mono)}
    .stat-l{font-size:12px;color:var(--n500);margin-top:4px}

    /* PROJECT CARD */
    .pcard{background:#fff;border:1px solid var(--n200);border-radius:var(--r);padding:16px 20px;cursor:pointer;transition:all var(--tr);position:relative;overflow:hidden;margin:12px}
    .pcard:hover{border-color:var(--accent);box-shadow:var(--shm);transform:translateY(-1px)}
    .pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--success)}
    .pcard.s-warn::before{background:var(--warning)}
    .pcard.s-dang::before{background:var(--danger)}
    .pcard.s-blok::before{background:var(--danger-dk)}
    .pname{font-size:15px;font-weight:700;color:var(--n900)}
    .pmeta{font-size:12px;color:var(--n500);display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
    .prog{height:5px;background:var(--n200);border-radius:99px;overflow:hidden;margin:10px 0}
    .prog-f{height:100%;border-radius:99px;background:var(--accent);transition:width .5s ease}

    /* BADGES */
    .bdg{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;display:inline-block}
    .b-norm{background:rgba(46,196,182,.12);color:#0d8a82}
    .b-warn{background:rgba(255,183,3,.15);color:#b37d00}
    .b-dang{background:rgba(230,57,70,.12);color:var(--danger)}
    .b-blok{background:rgba(155,30,38,.12);color:var(--danger-dk)}
    .b-done{background:rgba(46,196,182,.1);color:#0d8a82}
    .b-prog{background:rgba(232,97,10,.1);color:var(--accent)}
    .b-pend{background:rgba(136,136,136,.1);color:var(--n500)}
    .dl-0{background:#e8f5e9;color:#2e7d32}
    .dl-1{background:#fff8e1;color:#f57f17}
    .dl-2{background:#fff3e0;color:#e65100}
    .dl-3{background:#fce4ec;color:#b71c1c}
    .dl-4{background:#3d0000;color:#ff8a80}
    .r-unc{background:#f3f4f6;color:#6b7280}
    .r-pnd{background:#fef3c7;color:#92400e}
    .r-cfm{background:#d1fae5;color:#065f46}
    .r-exp{background:#fee2e2;color:#991b1b}

    /* MS ROW */
    .ms-table{width:100%}.ms-tr{transition:background .12s}.ms-tr:hover{background:var(--n100)!important}.ms-tr-alert{background:rgba(230,57,70,.05)!important}.ms-tr-alert:hover{background:rgba(230,57,70,.08)!important}
    
    

    /* BTN */
    .btn-ac{background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all var(--tr);display:inline-flex;align-items:center;gap:6px}
    .btn-ac:hover{background:var(--accent-lt);transform:translateY(-1px);box-shadow:0 4px 12px rgba(232,97,10,.3)}
    .btn-ic{width:30px;height:30px;border:1px solid var(--n200);border-radius:6px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--n700);transition:all var(--tr)}
    .btn-ic:hover{background:var(--n100)}
    .btn-ic.dl:hover{background:rgba(230,57,70,.08);border-color:var(--danger);color:var(--danger)}

    /* MODAL */
    .modal-content{border-radius:var(--r);border:none;box-shadow:var(--shl)}
    .modal-header{background:var(--n900);color:#fff;border-radius:var(--r) var(--r) 0 0;padding:14px 20px;border-bottom:2px solid var(--accent)}
    .modal-title{font-size:14px;font-weight:700}
    .modal-header .btn-close{filter:invert(1)}
    .form-label{font-size:12px;font-weight:600;color:var(--n700);margin-bottom:4px}
    .form-control{border:1.5px solid var(--n200);border-radius:var(--r);padding:9px 12px;font-size:13px}
    .form-control:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,97,10,.12);outline:none}

    /* LOADING/TOAST */
    .ld-ov{position:fixed;inset:0;background:rgba(247,247,247,.76);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:9999}
    .ld-box{min-width:150px;background:#fff;border:1px solid var(--n200);border-radius:12px;box-shadow:var(--shm);padding:18px 22px;display:flex;align-items:center;gap:12px;color:var(--n700);font-size:13px;font-weight:650}
    .ld-ring{width:44px;height:44px;border:3px solid rgba(232,97,10,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .t-msg{position:fixed;top:68px;right:20px;z-index:9999;min-width:280px;border-radius:var(--r);box-shadow:var(--shm);animation:sli .25s ease}
    @keyframes sli{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}

    /* UTILS */
    .font-mono{font-family:var(--mono)}
    .fw6{font-weight:600}
    .sec-title{font-size:18px;font-weight:700;color:var(--n900);margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .empty{text-align:center;padding:48px 24px;color:var(--n500)}
    .empty i{font-size:48px;margin-bottom:12px;display:block}
    .impact-box{background:#fff;border:2px solid var(--danger);border-radius:var(--r);padding:24px}
    .mobile-menu{display:none}
    .sidebar-scrim{display:none}
    @media(max-width:768px){
      :root{--topbar-h:60px}
      #sidebar{transform:translateX(-100%);transition:transform .22s ease;box-shadow:12px 0 30px rgba(0,0,0,.2)}
      body.nav-open #sidebar{transform:translateX(0)}
      body.nav-open .sidebar-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:90}
      #main{margin-left:0;min-width:0}
      #topbar{padding:0 14px}
      #page{padding:16px}
      .mobile-menu{display:inline-flex}
      #t-clk{display:none}
      .top-refresh-label{display:none}
      .lg-box{padding:28px 22px;border-radius:14px}
      .table-responsive{border-radius:var(--r)}
      .t-msg{left:16px;right:16px;min-width:0;top:72px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }
    /* 備註行內編輯 */
    .ms-note-edit-btn{display:none}
    .ms-tr:hover .ms-note-edit-btn{display:inline-flex}
    .ms-note-add-btn{opacity:0;transition:opacity .15s}
    .ms-tr:hover .ms-note-add-btn{opacity:1}
    .note-inline-editor{background:#fffbf0;border:1.5px solid var(--accent);border-radius:6px;padding:6px 8px;width:100%;margin-top:4px;resize:vertical;font-size:12px;font-family:var(--font);outline:none;min-height:52px;line-height:1.5}
    .note-inline-editor:focus{box-shadow:0 0 0 3px rgba(232,97,10,.12)}

    /* Drag sort */
    .sort-mode .drag-handle{display:flex!important}
    .sort-mode tr[data-mid]{cursor:grab}
    .sort-mode tr[data-mid]:hover{background:rgba(232,97,10,.06)!important}
    .sort-mode .sort-only{display:inline-flex!important}
    .sort-mode .normal-only{display:none!important}
    .sort-only{display:none}
    .sort-mode .sort-badge{display:inline-flex!important;width:18px;height:18px}
    .ms-tr.drag-over{outline:2px solid var(--accent);background:rgba(232,97,10,.08)!important}
    .ms-tr.dragging{opacity:.35;background:var(--n100)!important}
    .sort-mode-banner{background:rgba(232,97,10,.1);border:1.5px solid var(--accent);border-radius:var(--r);
      padding:8px 16px;font-size:12px;color:var(--accent);font-weight:600;
      display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    #btn-sort-mode.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    /* Admin Tab */
    .nav-tabs .nav-link { color: var(--n700); border-color: transparent; font-size:13px; font-weight:600; }
    .nav-tabs .nav-link.active { color: var(--accent); border-bottom-color: var(--accent); background: transparent; }
    .nav-tabs .nav-link:hover { color: var(--accent); border-color: transparent; }
    .nav-tabs { border-bottom: 2px solid var(--n200); }


    /* 多日期選擇器 */
    .date-pickers-grid { display:grid; gap:8px; }
    .date-picker-item { display:flex; align-items:center; gap:8px; background:var(--n100); border:1px solid var(--n200); border-radius:var(--r); padding:8px 12px; }
    .date-picker-label { font-size:11px; font-weight:700; color:var(--n500); min-width:64px; white-space:nowrap; }
    .date-picker-label.multi { color:var(--accent); }
    .date-picker-item input[type=date] { flex:1; border:1px solid var(--n300); border-radius:6px; padding:5px 10px; font-size:13px; background:#fff; }
    .date-picker-item input[type=date]:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 3px rgba(232,97,10,.12); }
    .dates-mode-tag { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; padding:3px 8px; border-radius:99px; margin-bottom:6px; }
    .dates-mode-tag.continuous { background:rgba(46,196,182,.12); color:#0d8a82; }
    .dates-mode-tag.multi { background:rgba(232,97,10,.12); color:var(--accent); }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lg-bg"></div>
  <form class="lg-box" onsubmit="doLogin(event)">
    <div class="lg-brand">
      <div class="brand-mark" aria-hidden="true">imPR</div>
      <div><div class="lg-brand-title">節點控管系統</div><div class="lg-brand-sub">Milestone Control System</div></div>
    </div>
    <div class="mb-3"><label class="lg-lbl" for="iu">帳號</label><input id="iu" name="username" type="text" class="lg-inp" placeholder="輸入帳號" autocomplete="username" autocapitalize="none" required /></div>
    <div class="mb-4"><label class="lg-lbl" for="ip">密碼</label>
      <div class="lg-password">
        <input id="ip" name="password" type="password" class="lg-inp" placeholder="輸入密碼" autocomplete="current-password" required />
        <button class="lg-password-toggle" type="button" aria-label="顯示密碼" aria-pressed="false" onclick="togglePassword(this)"><i class="bi bi-eye"></i></button>
      </div>
    </div>
    <button id="login-btn" class="btn-lg" type="submit"><span class="login-btn-label">登入系統</span></button>
    <div id="lerr" role="alert" aria-live="polite"></div>
    <div class="login-note">imPR 專案營運管理平台</div>
  </form>
</div>

<!-- APP -->
<div id="app-shell" style="display:none">
  <aside id="sidebar">
    <div class="sb-brand"><div class="brand-lockup"><div class="brand-mark">imPR</div><div class="brand-copy"><span class="brand-name">MCS</span><span class="brand-sub">Project Control</span></div></div></div>
    <nav class="sb-nav" aria-label="主要選單">
      <div class="nav-sec">主要功能</div>
      <button type="button" class="nav-a act" data-page="dashboard" onclick="nav('dashboard')"><i class="bi bi-grid-1x2-fill"></i>總覽</button>
      <button type="button" class="nav-a" data-page="projects" onclick="nav('projects')"><i class="bi bi-folder2-open"></i>專案管理</button>
      <button type="button" class="nav-a" data-page="closed" onclick="nav('closed')"><i class="bi bi-archive"></i>已結案專案</button>
      <button type="button" class="nav-a" data-page="resources" onclick="nav('resources')"><i class="bi bi-box-seam"></i>資源控管</button>
      <div class="nav-sec" style="margin-top:8px">分析工具</div>
      <button type="button" class="nav-a" data-page="delay-sim" onclick="nav('delay-sim')"><i class="bi bi-exclamation-triangle-fill"></i>延遲模擬</button>
      <button type="button" class="nav-a" data-page="kpi-dash" onclick="nav('kpi-dash')"><i class="bi bi-speedometer2"></i>KPI 儀表板</button>
      <button type="button" class="nav-a" data-page="admin" id="nav-adm" onclick="nav('admin')" style="display:none"><i class="bi bi-gear-fill"></i>系統管理</button>
      <button type="button" class="nav-a" data-page="workforce" onclick="nav('workforce')"><i class="bi bi-people-fill"></i>人力管理</button>
    </nav>
    <div class="sb-user">
      <div class="u-ava" id="s-ava">?</div>
      <div style="flex:1"><div class="u-name" id="s-name">-</div><div class="u-role" id="s-role">-</div></div>
      <button class="btn-out" onclick="doLogout()" title="登出"><i class="bi bi-box-arrow-right"></i></button>
    </div>
  </aside>
  <button class="sidebar-scrim" type="button" aria-label="關閉選單" onclick="closeNav()"></button>
  <div id="main">
    <div id="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn-ic mobile-menu" type="button" aria-label="開啟選單" onclick="toggleNav()"><i class="bi bi-list"></i></button>
        <div><div class="top-title" id="t-title">Dashboard</div><div class="top-meta" id="t-meta"></div></div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span id="t-clk" class="font-mono" style="font-size:11px;color:var(--n500)"></span>
        <button class="btn-ic top-refresh" onclick="refresh()" title="重新整理" aria-label="重新整理目前頁面"><i class="bi bi-arrow-clockwise"></i><span class="top-refresh-label">更新資料</span></button>

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ============================================================
// ★ 必改：貼上您的 GAS 部署 URL
// ============================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzhUkj4qok6CtSTN82wT_uMURtY6ZgmRXbpq924m1Z_BDao8jqnLzBWEZHKWgnRT9y8/exec';

// 品牌標誌改用 HTML / CSS 呈現，避免把大型圖片塞進首屏。

// ============================================================
// 全域狀態
// ============================================================
const APP = {token:null,user:null,page:'dashboard',proj:null};

// ============================================================
// 初始化
// ============================================================
document.addEventListener('DOMContentLoaded',()=>{
  const updateClock=()=>{
    const el=document.getElementById('t-clk');
    if(el) el.textContent=new Date().toLocaleString('zh-TW',{hour12:false,hour:'2-digit',minute:'2-digit'});
  };
  updateClock();
  setInterval(updateClock,60000);
  const t=localStorage.getItem('mcs_t'), u=localStorage.getItem('mcs_u');
  if(t&&u){
    try{ APP.token=t; APP.user=JSON.parse(u); showApp(); nav('dashboard'); }
    catch{ localStorage.removeItem('mcs_t'); localStorage.removeItem('mcs_u'); }
  }
});

// ============================================================
// 認證
// ============================================================
async function doLogin(event){
  if(event) event.preventDefault();
  const u=document.getElementById('iu').value.trim();
  const p=document.getElementById('ip').value.trim();
  if(!u||!p){lerr('請輸入帳號與密碼');return;}
  const btn=document.getElementById('login-btn');
  const label=btn.querySelector('.login-btn-label');
  document.getElementById('lerr').style.display='none';
  btn.disabled=true;
  btn.setAttribute('aria-busy','true');
  label.textContent='登入中…';
  try{
    const r=await doPost({action:'login',username:u,password:p});
    if(r.success){
      APP.token=r.token; APP.user=r.user;
      localStorage.setItem('mcs_t',r.token);
      localStorage.setItem('mcs_u',JSON.stringify(r.user));
      showApp(); nav('dashboard');
    } else lerr(r.error||'登入失敗');
  }catch(e){
    lerr('連線失敗，請確認 GAS_URL 設定是否正確。\n錯誤：'+e.message);
  }finally{
    btn.disabled=false;
    btn.removeAttribute('aria-busy');
    label.textContent='登入系統';
  }
}
function lerr(m){const el=document.getElementById('lerr');el.textContent=m;el.style.display='block';}
function togglePassword(btn){
  const input=document.getElementById('ip');
  const show=input.type==='password';
  input.type=show?'text':'password';
  btn.setAttribute('aria-label',show?'隱藏密碼':'顯示密碼');
  btn.setAttribute('aria-pressed',String(show));
  btn.querySelector('i').className=`bi ${show?'bi-eye-slash':'bi-eye'}`;
  input.focus();
}
function showApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app-shell').style.display='flex';
  document.getElementById('s-name').textContent=APP.user.displayName;
  document.getElementById('s-role').textContent=APP.user.role;
  document.getElementById('s-ava').textContent=APP.user.displayName.charAt(0);
  if(APP.user.role==='Admin') document.getElementById('nav-adm').style.display='flex';
}
function doLogout(){
  localStorage.removeItem('mcs_t'); localStorage.removeItem('mcs_u');
  APP.token=null; APP.user=null;
  closeNav();
  document.getElementById('login').style.display='grid';
  document.getElementById('app-shell').style.display='none';
  document.getElementById('ip').value='';
  document.getElementById('iu').focus();
}
function toggleNav(){document.body.classList.toggle('nav-open');}
function closeNav(){document.body.classList.remove('nav-open');}

// ============================================================
// 路由
// ============================================================
function refresh(){nav(APP.page,APP.proj);}
function nav(page,param){
  closeNav();
  APP.page=page;
  document.querySelectorAll('.nav-a').forEach(e=>e.classList.remove('act'));
  const navItem=document.querySelector(`.nav-a[data-page="${page}"]`);
  if(navItem) navItem.classList.add('act');
  switch(page){
    case 'dashboard':   loadDash();break;
    case 'projects':    loadProjs();break;
    case 'proj-detail': loadDetail(param);break;
    case 'closed':      loadClosed();break;
    case 'resources':   loadRes();break;
    case 'delay-sim':   loadDelay(param);break;
    case 'admin':       loadAdmin();break;
    case 'proj-stats':  loadProjStats(param);break;
    case 'logs':        loadLogs();break;
    case 'workforce':   loadWorkforce();break;
    case 'gantt':       loadGantt(param);break;
    case 'kpi-dash':    loadKpiDash(param);break;
    case 'proj-risk':   loadRiskReport(param);break;
  }
}

// ============================================================
// DASHBOARD
// ============================================================
async function loadDash(){
  setTop('Dashboard','imPR 會展節點控管系統');ld(true);
  try{
    const r=await doGet({action:'getDashboardData',token:APP.token});
    if(!r.success){apiErr(r);return;}
    const {summary:S,projects:P,upcomingResources:UR,overdueResources:OR}=r;
    const sc=s=>s==='卡關'?'s-blok':s==='延遲'?'s-dang':s==='注意'?'s-warn':'';
    const bc=s=>s==='卡關'?'b-blok':s==='延遲'?'b-dang':s==='注意'?'b-warn':'b-norm';
    const rc={未確認:'r-unc',暫保:'r-pnd',已確認:'r-cfm',已失效:'r-exp'};
    pg(`<div class="row g-3 mb-4">
      ${[{ic:'bi-folder2-open',cl:'ic-or',v:S.totalProjects,lb:'進行中專案'},
         {ic:'bi-check2-circle',cl:'ic-gr',v:(S.closedProjects||0),lb:'已結案'},
         {ic:'bi-exclamation-triangle-fill',cl:'ic-ye',v:S.delayedProjects,lb:'延遲專案'},
         {ic:'bi-alarm-fill',cl:'ic-re',v:S.criticalMilestoneDelays,lb:'關鍵節點延遲'}
        ].map(s=>`<div class="col-xl-3 col-md-6"><div class="stat">
          <div class="stat-ic ${s.cl}"><i class="bi ${s.ic}"></i></div>
          <div><div class="stat-v">${s.v}</div><div class="stat-l">${s.lb}</div></div>
        </div></div>`).join('')}
      </div>
      <div class="row g-3">
        <div class="col-xl-8">
          <div class="card">
            <div class="card-hdr"><span><i class="bi bi-kanban me-2"></i>專案總覽</span>
              ${canEdit()?`<button class="btn-ac" onclick="openProjM()"><i class="bi bi-plus"></i>新增專案</button>`:''}
            </div>
            ${P.length===0?`<div class="empty"><i class="bi bi-folder2"></i><p>尚無專案</p></div>`:
              P.map(p=>`<div class="pcard ${sc(p.status)}" onclick="nav('proj-detail','${p.projectId}')">
                <div class="d-flex justify-content-between align-items-start">
                  <div><div class="pname">${p.projectName}</div>
                    <div class="pmeta">
                      <span><i class="bi bi-building"></i>${p.clientName}</span>
                      <span><i class="bi bi-calendar3"></i>${fdDates(p)}</span>
                      <span><i class="bi bi-person-badge"></i>${p.pmName||'-'}</span>
                      <span style="background:rgba(232,97,10,.1);color:var(--accent);padding:1px 7px;border-radius:4px;font-size:10px">${p.eventType}</span>
                    </div>
                  </div>
                  <span class="bdg ${bc(p.status)}">${p.status}</span>
                </div>
                <div class="prog"><div class="prog-f" style="width:${p.progress}%;background:${p.progress<30?'var(--danger)':p.progress<70?'var(--warning)':'var(--accent)'}"></div></div>
                <div class="d-flex justify-content-between" style="font-size:11px;color:var(--n500)">
                  <span>${p.completedMilestones}/${p.totalMilestones} 節點</span>
                  <span class="font-mono">${p.progress}%</span>
                  ${p.delayedCount>0?`<span style="color:var(--danger)"><i class="bi bi-exclamation-circle me-1"></i>${p.delayedCount}個延遲</span>`:''}
                </div>
              </div>`).join('')}
          </div>
        </div>
        <div class="col-xl-4">
          <div class="card mb-3">
            <div class="card-hdr"><span style="color:var(--warning)"><i class="bi bi-clock-history me-2"></i>7日內到期資源</span><span class="bdg b-warn">${UR.length}</span></div>
            ${UR.length===0?`<div class="p-3 text-center" style="font-size:12px;color:var(--n500)">無即將到期資源 ✓</div>`:
              UR.slice(0,5).map(r=>`<div class="d-flex justify-content-between align-items-center p-3 border-bottom" style="font-size:12px">
                <div><div class="fw6">${r.resourceName}</div><div style="font-size:10px;color:var(--n500)">${r.type} · ${fd(r.cutoffDate)}</div></div>
                <span class="bdg ${rc[r.status]||''}">${r.status}</span>
              </div>`).join('')}
          </div>
          <!-- 人力負荷摘要 -->
          <div class="card mb-3" id="workload-dash-card">
            <div class="card-hdr"><span style="color:var(--accent)"><i class="bi bi-people-fill me-2"></i>人力負荷</span>
              <button class="btn-ic" onclick="loadWorkloadDash()" title="重新整理"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
            <div id="workload-dash-body" style="padding:12px;font-size:12px;color:var(--n500)">載入中...</div>
          </div>
          ${OR.length>0?`<div class="card">
            <div class="card-hdr" style="border-left:3px solid var(--danger)">
              <span style="color:var(--danger)"><i class="bi bi-exclamation-octagon me-2"></i>逾期未確認資源</span>
              <span class="bdg b-dang">${OR.length}</span>
            </div>
            ${OR.slice(0,5).map(r=>`<div class="d-flex justify-content-between align-items-center p-3 border-bottom" style="font-size:12px">
              <div><div class="fw6" style="color:var(--danger)">${r.resourceName}</div><div style="font-size:10px;color:var(--n500)">${r.type}</div></div>
              <span class="bdg r-exp">逾期</span>
            </div>`).join('')}
          </div>`:''}
        </div>
      </div>`);
    requestAnimationFrame(loadWorkloadDash);
  }catch(e){toast('danger','載入失敗：'+e.message);}finally{ld(false);}
}

async function loadDelay(mid){
  setTop('延遲影響模擬','關鍵節點延遲連鎖分析');
  if(!mid){pg(`<div class="empty"><i class="bi bi-exclamation-triangle" style="color:var(--warning)"></i><p>請從專案詳細頁選取延遲節點</p><button class="btn-ac mt-3" onclick="nav('projects')">前往專案</button></div>`);return;}
  ld(true);
  try{
    const r=await doGet({action:'calculateDelayImpact',token:APP.token,milestoneId:mid});
    if(!r.success){apiErr(r);return;}
    const lc=['#e8f5e9','#fff8e1','#fff3e0','#fce4ec','#2d0000'];
    const lt=['正常','輕微（可內部吸收）','中度（需壓縮後續）','嚴重（需啟動調整方案）','危急（需重新排程）'];
    pg(`<div class="impact-box" style="border-color:${r.delayLevel>=3?'var(--danger-dk)':'var(--warning)'}">
      <div class="d-flex align-items-center gap-3 mb-3">
        <i class="bi bi-exclamation-octagon-fill" style="font-size:28px;color:var(--danger)"></i>
        <div><div style="font-size:17px;font-weight:700">${r.milestoneName}</div>
          <div style="font-size:12px;color:var(--n500)">計畫日期：${fd(r.plannedDate)}</div></div>
        ${r.isCritical==='TRUE'?'<span class="bdg b-dang ms-auto">🔴 關鍵節點</span>':''}
      </div>
      <div class="row g-3 mb-4">
        <div class="col-md-3"><div style="font-size:11px;color:var(--n500)">延遲天數</div>
          <div style="font-size:40px;font-weight:900;font-family:var(--mono);color:var(--danger)">+${r.delayDays}</div></div>
        <div class="col-md-4"><div style="font-size:11px;color:var(--n500)">延遲等級</div>

let EVENT_TYPES = ['國際研討會','記者會','體驗活動','跨島大型活動','一般會議'];

async function loadEventTypesCache(){
  try{
    const r = await doGet({action:'getEventTypes', token:APP.token});
    if(r.success && r.eventTypes && r.eventTypes.length){
      EVENT_TYPES = r.eventTypes.filter(t => t.active === true || t.active === 'TRUE')
        .sort((a,b)=>Number(a.sortOrder||999)-Number(b.sortOrder||999))
        .map(t => t.eventTypeName);
      APP._eventTypeObjects = r.eventTypes;
    }
  }catch(e){ console.warn('EventTypes load failed', e); }
  return EVENT_TYPES;
}

async function loadEventTypesToSelect(selectId, selected){
  await loadEventTypesCache();
  const sel = document.getElementById(selectId);
  if(!sel) return;
  sel.innerHTML = '<option value="">請選擇</option>' + EVENT_TYPES.map(et =>
    `<option value="${esc(et)}" ${et===selected?'selected':''}>${esc(et)}</option>`
  ).join('');
  if(selected) sel.value = selected;
}

  const tab = document.getElementById('tab-type');

async function openEventTypeM(t){
  const isEdit = !!t;
  const name = prompt(isEdit?'修改專案類型名稱':'新增專案類型名稱', isEdit?t.eventTypeName:'');
  if(!name) return;
  const desc = prompt('類型說明', isEdit?(t.description||''):'');
  const sort = prompt('排序數字', isEdit?(t.sortOrder||999):999);
  const data = {eventTypeName:name.trim(), description:desc||'', sortOrder:Number(sort)||999, active:isEdit?(String(t.active)==='TRUE'||t.active===true):true};
  ld(true); try{
    const r = isEdit ? await doPost({action:'updateEventType', token:APP.token, eventTypeId:t.eventTypeId, data}) : await doPost({action:'addEventType', token:APP.token, data});
    if(r.success){toast('success', isEdit?'專案類型已更新':'專案類型已新增'); document.getElementById('tab-type').dataset.loaded=''; loadEventTypeTab();}
    else toast('danger', r.error);
  }finally{ld(false);}
}

async function toggleEventType(eventTypeId, active){
  ld(true); try{
    const r = await doPost({action:'toggleEventType', token:APP.token, eventTypeId, active});
    if(r.success){toast('success', active?'已啟用':'已停用'); document.getElementById('tab-type').dataset.loaded=''; loadEventTypeTab();}
    else toast('danger', r.error);
  }finally{ld(false);}
}

async function importEventTypesFromExisting(){
  if(!confirm('是否從既有 Templates / Projects 匯入專案類型？\n不會刪除原資料，也不會重複新增。')) return;
  ld(true); try{
    const r = await doPost({action:'seedEventTypesFromTemplates', token:APP.token});
    if(r.success){toast('success', `匯入完成，新增 ${r.imported||0} 筆類型`); document.getElementById('tab-type').dataset.loaded=''; loadEventTypeTab();}
    else toast('danger', r.error);
  }finally{ld(false);}
}

function tmplWeekLabel(wb){
  const w = Number(wb);
  if(w === 0) return '<span class="bdg b-prog" style="font-size:10px">活動當天</span>';
  if(w < 0)   return `<span class="bdg b-norm" style="font-size:10px">活動後 ${Math.abs(w)} 週</span>`;
  if(w < 1)   return `<span class="bdg b-warn" style="font-size:10px">活動前 ${Math.round(w*7)} 天</span>`;
  return `<span class="bdg b-dang" style="font-size:10px">T-${w}週</span>`;
}

// ── 模版新增/編輯 Modal ───────────────────────────────────────
async function openTmplM(tid, defaultType, existing){
  await loadEventTypesToSelect('ft-et', defaultType || APP._tmplFilter || '國際研討會');
  document.getElementById('tmpl-ttl').textContent = tid ? '編輯模版節點' : '新增模版節點';
  document.getElementById('ft-id').value = tid || '';
  if(existing){
    document.getElementById('ft-n').value    = existing.milestoneName || '';
    document.getElementById('ft-et').value   = existing.eventType || defaultType || '國際研討會';
    document.getElementById('ft-wb').value   = existing.weeksBefore || '';
    document.getElementById('ft-so').value   = existing.sortOrder || '';
    document.getElementById('ft-cr').checked = existing.isCritical === 'TRUE';
    document.getElementById('ft-rl').value   = existing.defaultRole || 'PM';
    document.getElementById('ft-desc').value = existing.description || '';
    document.getElementById('ft-af').value   = existing.affectedMilestones || '';
    // 編輯模式下鎖定活動類型（避免誤改）
    document.getElementById('ft-et').disabled = true;
  } else {
    ['ft-n','ft-desc','ft-af'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('ft-et').value   = defaultType || APP._tmplFilter || '國際研討會';
    document.getElementById('ft-et').disabled = false;
    document.getElementById('ft-wb').value   = '';
    document.getElementById('ft-so').value   = '';
    document.getElementById('ft-cr').checked = false;
    document.getElementById('ft-rl').value   = 'PM';
  }
  new bootstrap.Modal(document.getElementById('m-tmpl')).show();
}

async function submitTmpl(){
  const tid  = document.getElementById('ft-id').value;
  const name = document.getElementById('ft-n').value.trim();
  const et   = document.getElementById('ft-et').value;
  const wb   = document.getElementById('ft-wb').value;
  if(!name){toast('warning','請填寫節點名稱');return;}
  if(!et){toast('warning','請選擇活動類型');return;}
  if(wb===''||wb===null){toast('warning','請填寫完成時機（活動前幾週）');return;}

  const data = {
    milestoneName:      name,
    eventType:          et,
    weeksBefore:        Number(wb),
    isCritical:         document.getElementById('ft-cr').checked,
    defaultRole:        document.getElementById('ft-rl').value,
    description:        document.getElementById('ft-desc').value,
    affectedMilestones: document.getElementById('ft-af').value,
    sortOrder:          Number(document.getElementById('ft-so').value) || null
  };

  ld(true);
  try{
    const r = tid
      ? await doPost({action:'updateTemplate', token:APP.token, templateId:tid, data})
      : await doPost({action:'addTemplate',    token:APP.token, data});

    if(r.success){
      bootstrap.Modal.getInstance(document.getElementById('m-tmpl')).hide();
      toast('success', tid ? '模版節點已更新' : '模版節點已新增');
      document.getElementById('tab-tmpl').dataset.loaded = '';
      loadTmplTab(et);
    } else toast('danger', r.error);
  }finally{ld(false);}
}

async function delTmpl(tid, name){
  if(!confirm(`確定要刪除模版節點「${name}」？\n\n⚠ 此操作不影響已建立的專案節點，僅移除模版。`)) return;
  ld(true);
  try{
    const r = await doPost({action:'deleteTemplate', token:APP.token, templateId:tid});
    if(r.success){
      toast('success','模版節點已刪除');
      document.getElementById('tab-tmpl').dataset.loaded = '';
      loadTmplTab(APP._tmplFilter);

function renderDatePickers(presetDates){
  var wrap = document.getElementById('fp-dates-wrap');
  var days = parseInt(document.getElementById('fp-dy').value)||1;
  if(days<1){days=1;document.getElementById('fp-dy').value=1;}
  if(days>20){days=20;document.getElementById('fp-dy').value=20;}
  var isMulti = document.getElementById('fp-multi').checked;
  var modeTag = isMulti
    ? '<span class="dates-mode-tag multi"><i class="bi bi-calendar-week me-1"></i>多梯次 — 請個別選擇各梯日期</span>'
    : '<span class="dates-mode-tag continuous"><i class="bi bi-calendar-range me-1"></i>連續多天 — 自動帶入後續日期</span>';
  var items = '';
  for(var i=0;i<days;i++){
    var labelClass = isMulti ? 'multi' : '';
    var labelText  = days===1 ? '活動日期' : (isMulti ? '第 '+(i+1)+' 梯' : '第 '+(i+1)+' 天');
    var preVal = (presetDates && presetDates[i]) ? presetDates[i] : '';
    items += '<div class="date-picker-item" id="fp-date-item-'+i+'">'+
      '<span class="date-picker-label '+labelClass+'">'+labelText+'</span>'+
      '<input type="date" id="fp-date-'+i+'" class="form-control" value="'+preVal+'"'+
      (isMulti?'':' oninput="onContinuousDateChange('+i+')"')+' />'+
      '</div>';
  }
  wrap.innerHTML = (days>1?modeTag:'') + '<div class="date-pickers-grid">'+items+'</div>';
}

function onContinuousDateChange(idx){
  var baseVal = document.getElementById('fp-date-'+idx);
  if(!baseVal||!baseVal.value) return;
  var base = new Date(baseVal.value);
  var days = parseInt(document.getElementById('fp-dy').value)||1;
  for(var i=idx+1;i<days;i++){
    base.setDate(base.getDate()+1);
    var el = document.getElementById('fp-date-'+i);
    if(el) el.value = base.toISOString().split('T')[0];
  }
}

function getEventDates(){
  var days = parseInt(document.getElementById('fp-dy').value)||1;
  var dates = [];
  for(var i=0;i<days;i++){
    var el = document.getElementById('fp-date-'+i);
    if(el && el.value) dates.push(el.value);
    else dates.push('');
  }
  return dates;
}

function getFirstEventDate(){
  var dates = getEventDates();
  return dates.length>0 ? dates[0] : '';
}

// ★ API 呼叫工具（CORS 修正版）
// ============================================================
const GET_INFLIGHT=new Map();
async function fetchJson(url,options,timeoutMs=20000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{
    const res=await fetch(url,{...options,signal:controller.signal});
    if(!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    const txt=await res.text();
    try{return JSON.parse(txt);}catch{throw new Error('伺服器回應格式錯誤，請稍後再試');}
  }catch(e){
    if(e.name==='AbortError') throw new Error('連線逾時，請檢查網路後再試');
    throw e;
  }finally{clearTimeout(timer);}
}
function doGet(params){
  const qs=new URLSearchParams(params).toString();
  const url=`${GAS_URL}?${qs}`;
  if(GET_INFLIGHT.has(url)) return GET_INFLIGHT.get(url);
  const request=fetchJson(url,{method:'GET',redirect:'follow',cache:'no-store'})
    .finally(()=>GET_INFLIGHT.delete(url));
  GET_INFLIGHT.set(url,request);
  return request;
}
function doPost(body){
  return fetchJson(GAS_URL,{
    method:'POST',redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body)
  });
}

function esc(v){return String(v??'').replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c];});}
function fd(d){if(!d)return'';try{const dt=new Date(d);return isNaN(dt)?d:dt.toLocaleDateString('zh-TW');}catch{return d;}}
function fdDates(p){
  if(p.eventDates){
    try{
      var arr=JSON.parse(p.eventDates).filter(function(d){return d;});
      if(arr.length>1){
        if(p.isMultiSession==='TRUE'){
          return arr.map(function(d,i){return '第'+(i+1)+'梯 '+fd(d);}).join('　');
        } else {
          return fd(arr[0])+' ～ '+fd(arr[arr.length-1])+' ('+arr.length+'天)';
        }
      }
      if(arr.length===1) return fd(arr[0]);
    }catch(e){}
  }
  return fd(p.eventDate)||'日期待定';
}
let LOADING_COUNT=0;
function ld(show){
  const id='__ld';
  LOADING_COUNT=Math.max(0,LOADING_COUNT+(show?1:-1));
  if(LOADING_COUNT>0&&!document.getElementById(id)){
    const el=document.createElement('div');
    el.id=id;el.className='ld-ov';el.setAttribute('role','status');el.setAttribute('aria-live','polite');
    el.innerHTML='<div class="ld-box"><div class="ld-ring"></div><span>資料載入中…</span></div>';
    document.body.appendChild(el);
  }else if(LOADING_COUNT===0){
    const el=document.getElementById(id);if(el)el.remove();
  }
}
function toast(type,msg){
  const ex=document.querySelector('.t-msg');if(ex)ex.remove();
  const ic={success:'check-circle-fill',danger:'x-circle-fill',warning:'exclamation-triangle-fill'};
  const el=document.createElement('div');
  el.className=`alert alert-${type} alert-dismissible t-msg`;
  el.setAttribute('role','status');el.setAttribute('aria-live','polite');
  el.innerHTML=`<i class="bi bi-${ic[type]||'info-circle'} me-2"></i>${esc(msg)}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="關閉"></button>`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),4500);
}

async function _recalcMsDates(pid, newEventDate){
  ld(true);
  try{
    const r = await doPost({
      action:       'recalcMilestoneDates',
      token:        APP.token,
      projectId:    pid,
      newEventDate: newEventDate
    });
    if(r.success){
      // 顯示結果摘要
      const skippedNames = r.details
        .filter(d => d.action === 'skip')
        .map(d => `・${d.name}（${d.reason}）`)
        .join('\n');

      let msg = `節點日期已重算完成！\n\n✅ 已更新：${r.updated} 個節點`;
      if(r.skipped > 0){
        msg += `\n⏭ 跳過：${r.skipped} 個節點`;
        if(skippedNames) msg += `\n${skippedNames}`;
      }
      toast('success', `節點日期重算完成：${r.updated} 個已更新`);
      // 重新載入詳細頁
      if(APP.page === 'proj-detail') loadDetail(pid);
      else loadProjs();
    } else {
      toast('danger', '節點日期重算失敗：' + (r.error || '未知錯誤'));
      if(APP.page === 'proj-detail') loadDetail(pid);
      else loadProjs();
    }
  } catch(e){
    toast('danger', '重算失敗：' + e.message);
  } finally {
    ld(false);
  }
}

  if (existing) { existing.remove(); return; }

  // 取得目前備註內容（從 .ms-note-row 的 span 或空字串）
  const noteSpan = td.querySelector('.ms-note-row span');
  const current  = noteSpan ? noteSpan.textContent.trim() : '';

  // 建立行內編輯器
  const wrap = document.createElement('div');
  wrap.className = 'note-inline-editor-wrap';
  wrap.style.cssText = 'margin-top:6px';

  wrap.innerHTML = `
    <textarea class="note-inline-editor" placeholder="輸入備註（PM 工作日誌、注意事項、決策記錄…）" rows="3">${current}</textarea>
    <div style="display:flex;gap:4px;margin-top:4px;justify-content:flex-end">
      <button class="btn btn-sm btn-secondary" style="font-size:11px;padding:2px 10px"
              onclick="this.closest('.note-inline-editor-wrap').remove()">取消</button>
      <button class="btn-ac" style="font-size:11px;padding:3px 12px"
              onclick="saveNoteInline('${mid}','${pid}',this)">
        <i class="bi bi-save me-1"></i>儲存
      </button>
    </div>
  `;

  td.appendChild(wrap);
  wrap.querySelector('textarea').focus();

  // Enter+Ctrl 快捷儲存
  wrap.querySelector('textarea').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      saveNoteInline(mid, pid, wrap.querySelector('button.btn-ac'));
    }
    if (e.key === 'Escape') wrap.remove();
  });
}

/**
 * 儲存行內編輯的備註
 */
async function saveNoteInline(mid, pid, saveBtn) {
  const wrap    = saveBtn.closest('.note-inline-editor-wrap');
  const textarea = wrap.querySelector('textarea');
  const newNote  = textarea.value.trim();

  // 暫時停用按鈕
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<i class="bi bi-hourglass-split"></i>';

  try {
    const r = await doPost({
      action:      'updateMilestone',
      token:       APP.token,
      milestoneId: mid,
      data:        { notes: newNote }
    });

    if (r.success) {
      toast('success', '備註已儲存');
      wrap.remove();
      // 重新載入詳細頁以更新顯示
      loadDetail(pid);
    } else {
      toast('danger', '備註儲存失敗：' + (r.error || '未知錯誤'));
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<i class="bi bi-save me-1"></i>儲存';
    }
  } catch(e) {
    toast('danger', '連線失敗：' + e.message);
    saveBtn.disabled = false;
    saveBtn.innerHTML = '<i class="bi bi-save me-1"></i>儲存';
  }
}

// 快取：人員清單（Modal 開啟時載入一次）
let _userCache = null;

/**
 * 載入人員清單到 fm-uid 下拉選單
 */
async function loadUsersToSelect(selectId, selectedUserId) {
  const sel = document.getElementById(selectId);
  if (!sel) return;

  // 若有快取就用快取
  if (!_userCache) {
    try {
      const r = await doGet({ action: 'getUsers', token: APP.token });
      if (r.success) _userCache = r.users;
    } catch(e) { return; }
  }

  // 重建選項
  sel.innerHTML = '<option value="">未指派</option>';
  if (_userCache) {
    _userCache
      .filter(u => u.role !== 'Viewer' && (u.active === true || u.active === 'TRUE'))
      .forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.userId;
        opt.textContent = `${u.displayName}（${u.role}）`;
        if (u.userId === selectedUserId) opt.selected = true;
        sel.appendChild(opt);
      });
  }
}

/**
 * 在 openMsM 內呼叫，載入人員清單
 * （已在 openMsM 裡呼叫，此函數負責更新 hint）
 */
async function refreshAssignHint() {
  const uid = document.getElementById('fm-uid')?.value;
  const hint = document.getElementById('fm-assign-hint');
  if (!hint) return;
  if (!uid) { hint.textContent = ''; return; }

  try {
    const r = await doGet({ action: 'getUserWorkload', token: APP.token, targetUserId: uid });
    if (r.success) {
      const w = r.user;
      const color = w.loadRate >= 90 ? 'var(--danger)' : w.loadRate >= 60 ? 'var(--warning)' : 'var(--success)';
      hint.innerHTML = `<span style="color:${color}">負荷：${w.loadRate}% ｜ 進行中節點：${w.activeMs} 個</span>`;
    }
  } catch(e) {}
}

let _sortMode=false,_sortProjId=null,_dragSrcEl=null;
function toggleSortMode(pid){
  _sortMode=!_sortMode; _sortProjId=pid;
  const btn=document.getElementById('btn-sort-mode');
  const list=document.querySelector('tbody.ms-list-wrap');
  const banner=document.getElementById('sort-banner');
  if(!list)return;
  if(_sortMode){
    list.classList.add('sort-mode');
    if(btn)btn.classList.add('active');
    if(banner)banner.style.display='flex';
    list.querySelectorAll('tr[data-mid]').forEach(row=>row.setAttribute('draggable','true'));
    bindDragEvents(list);
  } else { exitSortMode(false); }
}
function exitSortMode(reload){
  _sortMode=false;
  const btn=document.getElementById('btn-sort-mode');
  const list=document.querySelector('tbody.ms-list-wrap');
  const banner=document.getElementById('sort-banner');
  if(list){
    list.classList.remove('sort-mode');
    list.querySelectorAll('tr[data-mid]').forEach(row=>{row.setAttribute('draggable','false');row.classList.remove('dragging','drag-over');});
  }
  if(btn)btn.classList.remove('active');
  if(banner)banner.style.display='none';
  if(reload) loadDetail(_sortProjId||APP.proj);
}
function bindDragEvents(container){
  container.querySelectorAll('tr[data-mid]').forEach(row=>{
    row.addEventListener('dragstart',onDragStart);
    row.addEventListener('dragover',onDragOver);
    row.addEventListener('dragleave',onDragLeave);
    row.addEventListener('drop',onDrop);
    row.addEventListener('dragend',onDragEnd);
  });
}
function onDragStart(e){_dragSrcEl=this;this.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',this.dataset.mid);}
function onDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';if(this===_dragSrcEl)return;this.classList.add('drag-over');}
function onDragLeave(){this.classList.remove('drag-over');}
function onDrop(e){
  e.stopPropagation();e.preventDefault();this.classList.remove('drag-over');
  if(!_dragSrcEl||_dragSrcEl===this)return;
  const parent=this.parentNode;if(!parent)return;
  const srcIdx=[...parent.children].indexOf(_dragSrcEl);
  const tgtIdx=[...parent.children].indexOf(this);
  if(srcIdx<tgtIdx){parent.insertBefore(_dragSrcEl,this.nextSibling);}else{parent.insertBefore(_dragSrcEl,this);}
  updateSortBadges(parent);
}
function onDragEnd(){document.querySelectorAll('.ms-tr').forEach(r=>r.classList.remove('dragging','drag-over'));_dragSrcEl=null;}
function updateSortBadges(container){let i=1;container.querySelectorAll('tr[data-mid]').forEach(row=>{const b=row.querySelector('.sort-badge');if(b)b.textContent=i;i++;});}
function moveMsUp(mid){const list=document.querySelector('tbody.ms-list-wrap');if(!list)return;const rows=[...list.querySelectorAll('tr[data-mid]')];const idx=rows.findIndex(r=>r.dataset.mid===mid);if(idx<=0)return;list.insertBefore(rows[idx],rows[idx-1]);updateSortBadges(list);}
function moveMsDown(mid){const list=document.querySelector('tbody.ms-list-wrap');if(!list)return;const rows=[...list.querySelectorAll('tr[data-mid]')];const idx=rows.findIndex(r=>r.dataset.mid===mid);if(idx<0||idx>=rows.length-1)return;list.insertBefore(rows[idx+1],rows[idx]);updateSortBadges(list);}
async function saveSortOrder(){
  const list=document.querySelector('tbody.ms-list-wrap');
  const pid=_sortProjId||APP.proj;
  if(!list||!pid){toast('warning','無法取得專案 ID，請重新整理後再試');return;}
  _sortProjId=pid;
  const rows=[...list.querySelectorAll('tr[data-mid]')];
  const orderedIds=rows.map((row,i)=>({milestoneId:row.dataset.mid,sortOrder:(i+1)*10}));
  if(orderedIds.length===0){exitSortMode(false);return;}
  ld(true);
  try{
    const r=await doPost({action:'reorderMilestones',token:APP.token,orderedIds:orderedIds});
    if(r.success){toast('success',`排序已儲存（${r.updated} 個節點更新）`);exitSortMode(true);}
    else toast('danger','排序儲存失敗：'+(r.error||'未知錯誤'));
  }catch(e){toast('danger','連線失敗：'+e.message);}
  finally{ld(false);}
}

async function loadGantt(pid){
  APP.proj=pid; setTop('甘特圖','籌備時程視覺化');ld(true);
  try{
    const r=await doGet({action:'getGanttData',token:APP.token,projectId:pid});
    if(!r.success){apiErr(r);return;}
    const{projectName,eventDate,minDate,maxDate,ganttRows}=r;
    const start=new Date(minDate); start.setDate(start.getDate()-7);
    const end=new Date(maxDate); end.setDate(end.getDate()+14);
    const totalDays=Math.max(1,Math.ceil((end-start)/86400000));
    const pct=(dateStr)=>{if(!dateStr)return null;const d=new Date(dateStr);const days=Math.ceil((d-start)/86400000);return Math.max(0,Math.min(100,days/totalDays*100));};
    const statusColor={'未開始':'var(--n300)','進行中':'var(--accent)','已完成':'var(--success)','延遲':'var(--warning)','卡關':'var(--danger)'};
    const today=new Date();today.setHours(0,0,0,0);
    const todayPct=pct(today.toISOString().split('T')[0]);
    const weeks=[];let d=new Date(start);
    while(d<=end){weeks.push({label:d.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'}),pct:pct(d.toISOString().split('T')[0])});d=new Date(d);d.setDate(d.getDate()+7);}
    pg(`<div class="d-flex align-items-center gap-2 mb-3" style="font-size:12px;color:var(--n500)">
      <a style="cursor:pointer;color:var(--accent)" onclick="nav('proj-detail','${pid}')">← 返回專案</a>
      <i class="bi bi-chevron-right"></i><span>甘特圖</span>
    </div>
    <div class="card" style="overflow:hidden">
      <div style="background:linear-gradient(90deg,var(--n900),var(--n700));color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between">
        <span style="font-weight:700;font-size:15px"><i class="bi bi-bar-chart-steps me-2"></i>${projectName} — 甘特圖</span>
        <span style="font-size:11px;opacity:.6;font-family:var(--mono)">${minDate} → ${maxDate}</span>
      </div>
      <div style="overflow-x:auto"><div style="min-width:900px">
        <div style="display:grid;grid-template-columns:220px 1fr;border-bottom:2px solid var(--n200)">
          <div style="padding:6px 12px;font-size:10px;font-weight:700;color:var(--n500);text-transform:uppercase;background:var(--n100)">節點名稱</div>
          <div style="position:relative;height:28px;background:var(--n100)">
            ${weeks.map(w=>`<span style="position:absolute;left:${w.pct}%;font-size:10px;color:var(--n500);transform:translateX(-50%);top:6px;white-space:nowrap">${w.label}</span>`).join('')}
            ${todayPct!==null?`<div style="position:absolute;left:${todayPct}%;top:0;bottom:0;width:2px;background:var(--accent);opacity:.5"></div>`:''}
          </div>
        </div>
        ${ganttRows.map(row=>{
          if(row.type==='category'){return `<div style="display:grid;grid-template-columns:220px 1fr;background:rgba(232,97,10,.08);border-bottom:1px solid rgba(232,97,10,.2)">
            <div style="padding:7px 12px;font-size:12px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px">
              <i class="bi bi-folder-fill" style="font-size:10px"></i>${row.name}
              <span style="font-size:10px;color:var(--n500);font-weight:400">${row.done}/${row.total}</span>
              ${row.delayed>0?`<span style="font-size:10px;color:var(--danger)">⚠${row.delayed}</span>`:''}
            </div>
            <div style="padding:7px 12px;display:flex;align-items:center">
              <div style="flex:1;height:6px;background:var(--n200);border-radius:99px;overflow:hidden;position:relative">
                <div style="position:absolute;left:${todayPct}%;top:0;bottom:0;width:1px;background:var(--accent);z-index:2"></div>
                <div style="height:100%;border-radius:99px;background:${row.delayed>0?'var(--warning)':row.progress===100?'var(--success)':'var(--accent)'};width:${row.progress}%"></div>
              </div>
              <span style="font-size:10px;font-family:var(--mono);color:var(--n500);margin-left:8px;width:32px">${row.progress}%</span>
            </div>
          </div>`;}
          const barLeft=pct(row.plannedDate);const barColor=statusColor[row.status]||'var(--n300)';
          return `<div style="display:grid;grid-template-columns:220px 1fr;border-bottom:1px solid var(--n200)" onmouseover="this.style.background='var(--n100)'" onmouseout="this.style.background='#fff'">
            <div style="padding:5px 12px 5px 20px;font-size:12px;display:flex;align-items:center;gap:4px;overflow:hidden">
              ${row.isCritical?'<span style="color:var(--danger);font-size:10px;flex-shrink:0">🔴</span>':'<span style="width:14px;flex-shrink:0"></span>'}
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:${row.status==='延遲'||row.status==='卡關'?'var(--danger)':'var(--n900)'}">${row.name}</span>
              ${row.delayDays>0?`<span style="font-size:10px;color:var(--danger);font-family:var(--mono);flex-shrink:0">+${row.delayDays}d</span>`:''}
            </div>
            <div style="position:relative;padding:5px 0">
              ${todayPct!==null?`<div style="position:absolute;left:${todayPct}%;top:0;bottom:0;width:1px;background:rgba(232,97,10,.3)"></div>`:''}
              ${barLeft!==null?`<div style="position:absolute;left:${barLeft}%;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:2px">
                <div style="width:3%;min-width:8px;height:${row.isCritical?14:10}px;background:${barColor};border-radius:3px" title="${row.name}|${row.status}|${row.plannedDate}"></div>
                ${row.status==='已完成'?'<i class="bi bi-check-circle-fill" style="font-size:10px;color:var(--success)"></i>':''}
              </div>`:'<div style="position:absolute;left:2px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--n300)">日期未定</div>'}
            </div>
          </div>`;
        }).join('')}
      </div></div>
    </div>`);
  }catch(e){toast('danger','甘特圖載入失敗：'+e.message);}
  finally{ld(false);}
}

async function loadRiskReport(pid){

  try{
    const[dr,rr]=await Promise.all([
      doGet({action:'getProjectDetail',    token:APP.token,projectId:pid}),
      doGet({action:'getProjectRiskReport',token:APP.token,projectId:pid})
    ]);
    if(!dr.success){apiErr(dr);return;}
    if(!rr.success){apiErr(rr);return;}
    const p=dr.project;const{overallRisk,catRisks,cascadeAlerts,kpiSummary}=rr;
    const riskLabel={normal:'正常',warning:'注意',error:'風險',critical:'危急'};
    const riskBg={normal:'var(--success)',warning:'var(--warning)',error:'var(--danger)',critical:'var(--danger-dk)'};
    const riskBgLt={normal:'transparent',warning:'rgba(255,183,3,.12)',error:'rgba(230,57,70,.1)',critical:'rgba(155,30,38,.15)'};
    const catOrder=['前期規劃','場地規劃','內容議程','宣傳報名','設計製作','輸出製作','現場執行','結案成果'];
    const KPI_LABELS={PLAN:'前期規劃',VENUE:'場地規劃',CONTENT:'內容議程',DESIGN:'設計製作',OUTPUT:'輸出製作',ONSITE:'現場執行',PROMO:'宣傳報名',CLOSE:'結案成果',OTHER:'其他'};
    const KPI_THRESH={PLAN:{warn:30,error:60},VENUE:{warn:14,error:30},CONTENT:{warn:14,error:21},DESIGN:{warn:7,error:14},OUTPUT:{warn:3,error:7},ONSITE:{warn:1,error:3},PROMO:{warn:7,error:14},CLOSE:{warn:14,error:30},OTHER:{warn:7,error:14}};
    pg(`<div class="d-flex align-items-center gap-2 mb-3" style="font-size:12px;color:var(--n500)">
      <a style="cursor:pointer;color:var(--accent)" onclick="nav('proj-detail','${pid}')">← 返回專案</a>
      <i class="bi bi-chevron-right"></i><span>風險分析</span>
    </div>
    <div style="background:${riskBg[overallRisk]};color:#fff;border-radius:var(--r);padding:16px 24px;margin-bottom:16px;display:flex;align-items:center;gap:16px">
      <i class="bi bi-shield-${overallRisk==='normal'?'check':'exclamation'}-fill" style="font-size:32px;opacity:.9"></i>
      <div>
        <div style="font-size:11px;opacity:.8;letter-spacing:1px;text-transform:uppercase">整體專案風險</div>
        <div style="font-size:24px;font-weight:900">${riskLabel[overallRisk]}${overallRisk==='critical'?' ⚠ 需立即處理':overallRisk==='error'?' ⚠ 需關注':''}</div>
        <div style="font-size:12px;opacity:.8">${p.projectName}</div>
      </div>
      ${cascadeAlerts.length>0?`<div style="margin-left:auto;background:rgba(0,0,0,.2);border-radius:8px;padding:8px 14px;text-align:center"><div style="font-size:22px;font-weight:900">${cascadeAlerts.length}</div><div style="font-size:10px;opacity:.8">連鎖警報</div></div>`:''}
    </div>
    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card mb-3">
          <div class="card-hdr"><span><i class="bi bi-grid-3x2-gap me-2"></i>分類風險矩陣</span></div>
          <div style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
            ${catOrder.map(cat=>{const s=catRisks[cat];if(!s)return'';const rl=s.riskLevel||'normal';
              return `<div style="border-radius:8px;padding:12px;background:${riskBgLt[rl]};border:1.5px solid ${riskBg[rl]}">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                  <span style="font-size:12px;font-weight:700;color:var(--n900)">${cat}</span>
                  <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:${riskBg[rl]};color:#fff">${riskLabel[rl]}</span>
                </div>
                <div style="height:6px;background:rgba(0,0,0,.1);border-radius:99px;overflow:hidden;margin-bottom:6px">
                  <div style="height:100%;border-radius:99px;background:${riskBg[rl]};width:${s.progress}%"></div>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--n700)">
                  <span>${s.done}/${s.total} 完成</span>
                  ${s.maxDelay>0?`<span style="color:var(--danger);font-weight:700">延遲 +${s.maxDelay}天</span>`:`<span style="color:var(--success)">✓ 正常</span>`}
                </div>
              </div>`;}).join('')}
          </div>
        </div>
        ${cascadeAlerts.length>0?`<div class="card">
          <div class="card-hdr" style="border-left:3px solid var(--danger)"><span style="color:var(--danger)"><i class="bi bi-link-45deg me-2"></i>連鎖影響警報（${cascadeAlerts.length}）</span></div>
          ${cascadeAlerts.map(a=>`<div style="padding:12px 16px;border-bottom:1px solid var(--n200);background:${riskBgLt[a.riskLevel]}">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
              <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:${riskBg[a.riskLevel]};color:#fff">${riskLabel[a.riskLevel]}</span>
              <span style="font-size:13px;font-weight:700">${a.sourceCat}</span>
              <span style="font-size:11px;color:var(--danger);font-family:var(--mono)">+${a.maxDelay}天</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <i class="bi bi-arrow-right" style="color:var(--danger)"></i>
              ${a.downstream.map(d=>`<span style="background:rgba(230,57,70,.1);color:var(--danger);padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600">${d}</span>`).join('')}

      </div>
      <div class="col-lg-5">
        <div class="card">
          <div class="card-hdr"><span><i class="bi bi-speedometer2 me-2"></i>KPI 健康指標</span></div>
          <div style="padding:14px">
            ${Object.entries(kpiSummary).map(([kpi,s])=>{
              const thresh=KPI_THRESH[kpi]||KPI_THRESH.OTHER;
              const status=s.maxDelay>=thresh.error?'error':s.maxDelay>=thresh.warn||s.delayed>0?'warning':'normal';
              const kpiIcon={PLAN:'calendar3',VENUE:'geo-alt',CONTENT:'file-text',DESIGN:'palette',OUTPUT:'printer',ONSITE:'people',PROMO:'megaphone',CLOSE:'archive',OTHER:'dot'};
              const prog=s.total>0?Math.round(s.done/s.total*100):0;
              return `<div style="margin-bottom:12px;padding:10px;border-radius:6px;background:${riskBgLt[status]};border:1px solid ${status==='normal'?'var(--n200)':riskBg[status]}">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
                  <span style="font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px">
                    <i class="bi bi-${kpiIcon[kpi]||'dot'}" style="color:${riskBg[status]}"></i>${KPI_LABELS[kpi]||kpi}
                  </span>
                  <div style="display:flex;align-items:center;gap:6px">
                    ${s.maxDelay>0?`<span style="font-size:10px;font-family:var(--mono);color:var(--danger)">+${s.maxDelay}d</span>`:''}
                    <span style="font-size:10px;padding:1px 7px;border-radius:99px;background:${riskBg[status]};color:#fff;font-weight:700">${{normal:'正常',warning:'注意',error:'風險'}[status]||status}</span>

                </div>
                <div style="height:8px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden">
                  <div style="height:100%;border-radius:99px;background:${riskBg[status]};width:${prog}%;transition:width .5s"></div>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--n500);margin-top:4px">
                  <span>${s.done}/${s.total} 完成 · ${prog}%</span>
                  <span>警戒：${thresh.warn}天 / 危急：${thresh.error}天</span>
                </div>
              </div>`;}).join('')}
          </div>
        </div>
      </div>
    </div>`);
  }catch(e){toast('danger','載入失敗：'+e.message);}
  finally{ld(false);}
}

                    <div style="position:absolute;bottom:0;left:0;right:0;height:${s.progress}%;background:${rb[rl]};transition:height .5s"></div>
                  </div>
                  <div style="font-size:9px;color:${rb[rl]};font-weight:700;line-height:1.2">${cat.slice(0,2)}</div>
                </div>`;}).join('')}
            </div>
            ${alerts.length>0?`<div style="background:rgba(230,57,70,.08);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--danger)"><i class="bi bi-link-45deg me-1"></i>${alerts.length} 個連鎖警報：${alerts.map(a=>a.sourceCat).join('、')}</div>`:'<div style="font-size:11px;color:var(--success)"><i class="bi bi-check-circle me-1"></i>無連鎖風險</div>'}
          </div>
        </div></div>`;}).join('')}
    </div>`}
    `);
  }catch(e){toast('danger','KPI載入失敗：'+e.message);}
  finally{ld(false);}
}

async function loadLogTab(){
  const tab=document.getElementById('tab-log');
  if(!tab)return;
  tab.dataset.loaded='1';
  try{
    const r=await doGet({action:'getLogs',token:APP.token,limit:'200'});
    if(!r.success){tab.innerHTML=`<div class="empty"><i class="bi bi-x-circle text-danger"></i><p>${r.error}</p></div>`;return;}
    const actionColor={LOGIN:'b-norm',LOGOUT:'b-pend',CREATE_PROJECT:'b-prog',CLOSE_PROJECT:'b-pend',REOPEN_PROJECT:'b-norm',ADD_MILESTONE:'b-prog',UPDATE_MILESTONE:'b-warn',DELETE_MILESTONE:'b-dang',ADD_RESOURCE:'b-prog',UPDATE_RESOURCE:'b-warn',ADD_TEMPLATE:'b-prog',UPDATE_TEMPLATE:'b-warn',DELETE_TEMPLATE:'b-dang',ADD_USER:'b-prog',UPDATE_USER:'b-warn'};
    const actionIcon={LOGIN:'box-arrow-in-right',LOGOUT:'box-arrow-right',CREATE_PROJECT:'folder-plus',CLOSE_PROJECT:'archive',REOPEN_PROJECT:'arrow-counterclockwise',ADD_MILESTONE:'plus-circle',UPDATE_MILESTONE:'pencil',DELETE_MILESTONE:'trash',ADD_RESOURCE:'box-seam',UPDATE_RESOURCE:'pencil',ADD_TEMPLATE:'diagram-3',UPDATE_TEMPLATE:'pencil',DELETE_TEMPLATE:'trash',ADD_USER:'person-plus',UPDATE_USER:'person-gear'};
    tab.innerHTML=`<div class="d-flex justify-content-between align-items-center mb-3">
      <div style="font-size:13px;color:var(--n500)">最近 ${r.logs.length} 筆操作記錄</div>
      <button class="btn-ic" onclick="loadLogTab()" title="重新整理"><i class="bi bi-arrow-clockwise"></i></button>
    </div>
    <div class="card">
      <table class="table table-hover mb-0" style="font-size:12px">
        <thead style="background:var(--n100)"><tr><th class="ps-3" style="width:160px">時間</th><th style="width:160px">操作類型</th><th>說明</th><th style="width:100px">操作人</th></tr></thead>
        <tbody>${r.logs.length===0?'<tr><td colspan="4" class="text-center py-4" style="color:var(--n500)">尚無日誌</td></tr>':
          r.logs.map(log=>`<tr>
            <td class="ps-3 font-mono" style="color:var(--n500);font-size:11px">${new Date(log.timestamp).toLocaleString('zh-TW',{hour12:false})}</td>
            <td><span class="bdg ${actionColor[log.action]||'b-pend'}" style="font-size:10px"><i class="bi bi-${actionIcon[log.action]||'dot'} me-1"></i>${log.action}</span></td>
            <td style="font-size:12px">${log.description||'-'}</td>
            <td style="font-size:11px;color:var(--n500)">${log.userId||'-'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }catch(e){tab.innerHTML=`<div class="empty"><i class="bi bi-exclamation-triangle text-danger"></i><p>${e.message}</p></div>`;}
}

</script>
